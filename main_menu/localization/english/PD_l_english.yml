 PD_pa_sec_target: "The Current Target"
 PD_pa_target_none: "No target this month"
 PD_pa_target_tt: "The country Berlin is currently working against.\n\nA target is taken up only when there is none, and then held until the matter is settled. It clears itself if the country is annexed, becomes a subject, or a truce comes between.\n\n#T What sets the pace#!\nNot the situation. The tempo comes from the $rule_BRA_prussian_buff_rule$ game rule:\n$BULLET$#Y Terminator#! - a new war may open every #Y 12#! months, and no sooner than a year after the last one ended.\n$BULLET$#Y Historical#! or #Y Vanilla#! - every #Y 60#! months, and no sooner than two years after the last one.\n\n#T When nothing is in reach#!\nA country is only taken up while its whole defensive network is weaker than Prussia's offensive one. Where that is never true the step would stall for ever, so after #Y 10#! years the bar moves to #Y 1.5:1#! against that network - provided Prussia also out-guns the target's own army - and after #Y 20#! the step-1 board widens westward. Both show on the road card."

 PD_pa_history_header: "Historical Context"
 PD_pa_history_body: "#T The wound: Silesia, 1740#!\nIn December 1740, weeks after Maria Theresa inherited the Habsburg lands, Frederick II marched into Silesia without a declaration and without a real claim. It was the richest province Austria held, and taking it made Prussia a great power and Austria an enemy for a century. Vienna fought three wars to get it back - 1740, 1744 and the Seven Years' War - and failed in all three. Every later quarrel between Berlin and Vienna is downstream of that winter.\n\n#T The quiet instrument: the Zollverein, 1834#!\nOn the first day of 1834 the Prussian customs union opened its borders across most of the German states. It carried no flag and demanded no oath; it simply made trade easier inside it than outside it, and it left Austria out. Within a generation the German economy was organised around Berlin while the German constitution still pointed at Vienna. Unification was being built by tariff schedules long before it was built by armies.\n\n#T The settlement: 1866#!\nThe question of who would speak for Germany was answered in seven weeks. At Koeniggraetz in July 1866 Prussia broke the Austrian army, dissolved the old German Confederation, and bound the north into a confederation of its own. Austria was not annexed and barely punished - Bismarck wanted it out of Germany, not destroyed. The southern kingdoms stayed outside, and answering that remained for the war with France."

 PD_pa_levers_header: "What We Can Do"
 PD_pa_levers_body: "#T As [GetCountry('PRU').GetName]#!\n$BULLET$The step only moves when a whole set of areas is yours or your subjects'. Partial conquest buys nothing here - one unclaimed location in [ShowAreaName('silesia_area')] holds the entire situation on step 1.\n$BULLET$If [ShowAreaName('silesia_area')] sits behind a great power, the situation waits before it gambles: ten years on the step and Berlin will accept odds of #Y 1.5:1#! against the enemy's alliance instead of even ones, twenty and it turns west first to grow. Neither shortens the step - Silesia is still the entire price of it.\n$BULLET$A subject counts the same as direct ownership. Vassalising a holdout advances the step exactly as annexing it would, and it is usually cheaper.\n$BULLET$The Zollverein is the cheap road through step 2. A state that accepts is bound without a war; a state that refuses has to be taken.\n$BULLET$At step 3 the quarrel becomes the Emperor's. Win that war and the north is yours; lose it and [ShowPeaceTreatyTypeName('PD_emperor_crush_prussian_hegemony')] can end this situation for good.\n\n#T As a German state in the way#!\n$BULLET$You will be told when Silesia falls, because you are on the list that follows it.\n$BULLET$When the Zollverein is offered, accepting binds you to Berlin without a shot. Refusing is legitimate and survivable - but it moves you from the diplomatic column to the military one.\n$BULLET$Your best protection is not your own army. It is being unprofitable to attack while the Emperor is still willing to march.\n\n#T As the Emperor#!\n$BULLET$Nothing you do before step 3 slows Berlin; the early steps are fought over other men's lands.\n$BULLET$The ultimatum is the moment. Win the war it starts and [ShowPeaceTreatyTypeName('PD_emperor_crush_prussian_hegemony')] shatters the Prussian sphere and cancels the ascension permanently.\n\n#T How the AI plays this#!\n$BULLET$It never hesitates. Five of this situation's events offer a choice, and in every one of them the AI weighting is a number against #Y zero#! - so the AI takes the first option every single time.\n$BULLET$The second option is not hidden from it. There is not one AI gate anywhere in these events; the alternative is simply weighted to nothing and therefore never chosen. Those choices exist for a human sitting in one of these seats.\n$BULLET$So the AI's path is fixed: it takes Silesia, it offers the Zollverein, it presses the insolence, and it answers the Emperor with war. What varies is not its decisions but whether its armies can carry them.\n$BULLET$What stops it is arithmetic, not nerve. It will not open a war while the target's alliance network outweighs its own, so a well-allied holder of [ShowAreaName('silesia_area')] can bar the road for decades - until the ten-year mark, when Berlin raises the odds it is willing to take.\n$BULLET$The remaining sixteen events carry a single option each. They are news, not decisions - sent to onlookers, to the next victims, and to whoever just won or lost."

 # ==============================================================================
 # THE PRUSSIAN AMBITION - SITUATION PANEL
 # Figures below come from docs/AMBITION-NOTES.md, read out of
 # brandenburg_rise.txt and the 18 phase-1 events.
 # ==============================================================================

 PD_AM_BALANCE_LABEL: "The Baltic Balance"
 PD_am_balance_tt: "#T What the score is#!\nRecomputed for both sides every month, and nothing else feeds it:\n$BULLET$army strength\n$BULLET$monthly trade and tax income\n$BULLET$#Y one fifth#! of prestige\n\n#T What it decides#!\nWhichever side is ahead is the side allowed to act. A tie counts as Brandenburg's - the Order needs to be strictly ahead to take its own opening.\n\nThe bar is the share, not the total: it fills toward whoever is leading.\n\n[GetCountry('BRA').GetName]: [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('PD_bra_score').GetValue|2]\n[GetCountry('TEU').GetName]: [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('PD_teu_score').GetValue|2]"

 PD_am_standings_header: "The Standings"
 PD_am_standings_hint: "The side that is ahead is the side allowed to move. Hover a score to see what makes it."
 PD_am_word_leading: "Leading"
 PD_am_word_behind: "Behind"
 PD_am_sec_targets: "What Each Side Is Working On"
 PD_am_target_none: "No target this month"
 PD_am_target_tt: "The country this side is currently working against.\n\nA side takes up a target only when it has none, and then holds it until the matter is settled.\n\n#T What sets the pace#!\nThe two are not paced alike. [GetCountry('BRA').GetName] may choose again after #Y 12#! months; the Order must wait #Y 48#!. An opening the Order misses does not come round as often."

 PD_am_history_header: "Historical Context"
 PD_am_history_body: "#T Two neighbours, both borrowed#!\nThe Teutonic Order had ruled Prussia since the 1230s as a crusading state answerable to nobody but the Pope. The Hohenzollerns arrived in Brandenburg much later and by purchase: in 1415 the Emperor handed the margraviate to a Nuremberg burgrave who had lent him money. Neither house was native to the sand it ended up governing.\n\n#T The Order breaks#!\nAt Tannenberg in 1410 a Polish-Lithuanian army destroyed the Order's field force and, with it, the argument that it was Christendom's shield. The Thirteen Years' War finished the job: by the Second Peace of Thorn in 1466 the Order had lost western Prussia outright and held the rest as a vassal of the Polish crown. A crusading state that owes homage to a king is no longer a crusading state.\n\n#T The quietest conquest in German history#!\nIt never came to the war this situation stages. In 1525 the Grand Master, Albert of Hohenzollern-Ansbach, converted to Lutheranism and turned the Order's lands into the secular Duchy of Prussia - with himself as duke. He was a Hohenzollern, a cousin of the Elector of Brandenburg. When his line died out in 1618 the duchy simply passed to Berlin, and Brandenburg-Prussia existed.\n\n#Y In this campaign it is fought for instead of inherited.#! The score below is the mod's answer to a question history settled with a conversion and a funeral."

 PD_am_levers_header: "What We Can Do"
 PD_am_levers_body: "#T As [GetCountry('BRA').GetName]#!\n$BULLET$The score is three things and only three: army strength, monthly trade and tax, and a fifth of your prestige. Prestige is the cheap one - a fifth of it counts, and it moves faster than an army does.\n$BULLET$You do not need to be far ahead, only ahead. A tie counts as yours; the Order has to be strictly higher to take its own opening.\n$BULLET$Winning does not require conquering the Order. It ends when the Order is your subject, or when it holds nothing in [ShowAreaName('brandenburg_area')], [ShowAreaName('pomerania_area')] or [ShowAreaName('prussia_area')] while you hold Koenigsberg or Gdansk.\n\n#T As the Teutonic Order#!\n$BULLET$Same three numbers, and you are the one who has to be strictly ahead. Parity is a loss.\n$BULLET$You are also paced slower by design: Brandenburg may choose a new target every #Y 12#! months, you every #Y 48#!. Openings you miss do not come round as often.\n$BULLET$Your own knockout branch exists. This is not a situation you can only survive.\n\n#T As anyone else on the Baltic#!\n$BULLET$If you are the strongest European enemy of whichever side is being targeted, expect an envoy. That is not flavour - the loser of the score goes looking for exactly that country.\n$BULLET$Destroying the Order yourself also ends this situation, once the timeline date has passed.\n\n#T How the AI plays this#!\n$BULLET$Three of the four branching events are weighted against #Y zero#!, so the AI takes the first option every time - the same as in the mod's other two situations.\n$BULLET$#Y The one exception is worth knowing.#! When a side is about to move, it searches its target's enemies and rivals for the strongest one in Europe that holds no land in the three contested areas, and offers to strike together. That offer is weighted #Y 1000 to 1#! against going it alone - so about once in a thousand the AI refuses the ally it just went looking for. It is the only genuine coin-flip in the mod, even if it is a very unfair coin.\n$BULLET$The remaining fourteen events carry one option each. They are news, not decisions."

 PD_pa_state_done: "Done"
 PD_pa_state_current: "Current"
 PD_pa_state_ahead: "Ahead"
 PD_pa_state_diverted: "Blocked - marching west"

# ==============================================================================
# THE BOHEMIAN ESTATES CRISIS - disaster. See docs/BOHEMIA-DISASTER.md.
# ==============================================================================
 PD_bohemian_estates_crisis: "The Bohemian Estates Crisis"
 PD_bohemian_estates_crisis_desc: "The crown and the estates of Bohemia no longer agree on who rules. Neither side can govern without the other, and neither will yield first."
 PD_boh_end_concessions_tt: "The estates have been bought: their privileges are confirmed in writing"
 PD_boh_end_repression_tt: "The estates have been broken: their leaders are scattered and their assemblies dissolved"
 PD_boh_end_crown_lost_tt: "[ShowLocationName('prague')] has passed to another crown, and this quarrel with it"
 pd_bohemia.1.title: "The Defenestration of Prague"
 pd_bohemia.1.desc: "On the twenty-third of May the estates came to the Hradcany with a grievance and left without one. The royal governors were carried to a window of the chancellery and thrown from it into the ditch below, and with them went every pretence that this kingdom is governed by consent.\n\nThe estates have not asked for a new king; they have said the old one forfeited the crown by breaking his own charter. That is not a riot. It is a constitutional argument backed by armed men, and it will be settled the same way.\n\nOur alliances did not survive the news. A crown whose right to the throne is being argued in its own capital is not one anybody will march for, and the ambassadors have gone home to wait and see who wins."
 pd_bohemia.1.a: "Then let it be settled."
 pd_bohemia.2.title: "A Rival Crowned in Prague"
 pd_bohemia.2.desc: "A foreign army came up the Vltava in the autumn and the capital did not hold a week. In December the pretender was crowned in Prague, and a good part of the Bohemian nobility knelt to him - not from love of him, but because a crown in the room outweighs a crown far away.\n\nThe kingdom is not lost. But it is being fought over by two claimants while its estates watch to see which one to obey, and every month that question stays open is a month the realm cannot be governed.\n\nOur alliances have lapsed with the question. No court will bind itself to one of two kings before it knows which one it is."
 pd_bohemia.2.a: "Then we must be the one in the room."
 pd_bohemia.10.title: "The Estates Convene"
 pd_bohemia.10.desc: "They have come back to the table, as they do every second year now, with the same list and rather more confidence.\n\nConfirm their privileges and the diet ends this afternoon. But a charter confirmed is a charter the crown does not get back: each one leaves this office commanding a little less of its own kingdom, and that does not expire when the quarrel does.\n\nOr send soldiers, seize the estates of the ringleaders and dissolve the assembly. That costs gold we would rather spend elsewhere, men we cannot quickly replace, and the patience of a country already tired of soldiers - but none of it is permanent. What is spent today can be earned back by a king who still commands."
 pd_bohemia.10.a: "Confirm their privileges."
 pd_bohemia.10.b: "Answer them with the army."
 pd_bohemia.20.title: "Trouble in Bohemia"
 pd_bohemia.20.desc: "Word comes from the south that the Bohemian crown and its estates have fallen out badly enough that neither can govern. Reports differ on who began it; they agree on what it means. A kingdom arguing with itself raises fewer men and collects less tax, and everyone with a border to it has noticed.\n\nIts alliances, we are told, have quietly lapsed. Nobody is willing to be bound to whoever turns out to have lost."
 pd_bohemia.20.a: "We shall watch with interest."
 pd_bohemia.100.title: "The Privileges Confirmed"
 pd_bohemia.100.desc: "It is signed. The estates keep their charter, their assemblies and their right to be consulted, and in exchange they remember whose crown it is they are consulting.\n\nThe crown that emerges is smaller than the one that went in - it must ask where it used to command. But the kingdom is whole, its nobility is not in exile, and the men who would have died at the muster are alive and paying tax."
 pd_bohemia.100.a: "A crown that asks is still a crown."
 pd_bohemia.101.title: "The Estates Broken"
 pd_bohemia.101.desc: "The assembly is dissolved, its leaders are dead or across the border, and their lands have been distributed to men who will not forget who gave them.\n\nNo one will raise this argument again for a generation. What the kingdom has instead of an argument is a silence, and a nobility rebuilt out of strangers, and a treasury that paid for both."
 pd_bohemia.101.a: "Silence will do."
 PD_boh_card_state: "Where the Argument Stands"
 PD_boh_card_levers: "The Two Answers"
 PD_boh_state_concessions: "#T Confirmed privileges#!  [DisasterView.GetDisaster.GetOwner.MakeScope.GetVariable('PD_boh_concessions').GetValue|Y0] of 100\nEach diet the crown settles by charter rather than by soldiers moves this. At 100 the estates have what they asked for and the quarrel is over."
 PD_boh_state_repression: "#T Broken assemblies#!  [DisasterView.GetDisaster.GetOwner.MakeScope.GetVariable('PD_boh_repression').GetValue|Y0] of 100\nEach diet answered with troops and confiscations moves this instead. At 100 there is no one left to convene."
 PD_boh_levers_body: "The estates return every two years, and each time there are two ways through. They are not a large price and a small one - they are a cheap present against an expensive future, and its reverse.\n\n#T Confirm their privileges#!\n$BULLET$Cheap today: some legitimacy, and a nobility that goes home satisfied.\n$BULLET$Expensive forever. Every charter confirmed leaves a permanent modifier on this country - the crown's own estate power, the levies the nobles owe and the levies the realm raises all fall a little further, and none of it is ever returned.\n$BULLET$Reaching 100 ends the crisis with the kingdom whole and the crown permanently smaller.\n\n#T Answer them with the army#!\n$BULLET$Expensive today: gold, months of manpower, war exhaustion, prestige, and an estate that remembers being broken.\n$BULLET$But nothing of it is permanent. Every one of those recovers.\n$BULLET$Reaching 100 ends the crisis with no one left to raise the question, and a crown that commands what it always commanded.\n\n#T Neither is the right answer#!\n$BULLET$The AI is weighted evenly between them - unlike the situations in this mod, where it is deterministic on purpose.\n$BULLET$And while this runs, the realm's alliances are already gone, rebels grow, a third of the manpower is unavailable and the nobles' levies with it. A kingdom arguing with itself cannot defend what it holds, and its neighbours can see that."
 PD_boh_card_history: "Historical Context"
 PD_boh_history_body: "#T The window, 1618#!\nOn 23 May 1618 the Bohemian estates carried two royal governors and their secretary to a window of the Prague chancellery and threw them out of it. All three survived the fall, which both sides took as proof of divine favour. The quarrel underneath was constitutional: the estates held that the king had broken the charter of religious liberties he was crowned on, and had therefore forfeited the crown. They elected another man to it. Ferdinand answered at the White Mountain outside Prague on 8 November 1620, in a battle that lasted about two hours, and the Verneuerte Landesordnung of 1627 ended Bohemian self-government for two centuries.\n\n#T The other crown, 1741#!\nWhen Charles VI died leaving only a daughter, half of Europe discovered an objection. A Franco-Bavarian army took Prague in November 1741 and Charles Albert of Bavaria was crowned King of Bohemia there in December; a good part of the Bohemian nobility swore to him. Maria Theresa retook the city within a year and never forgave those who had knelt.\n\n#T Why it matters beyond Bohemia#!\nBoth times, a kingdom that could not settle who ruled it stopped being able to defend what it held. The second occasion is the reason Silesia was takeable at all - Austria lost the richest province it owned because it was being pulled apart from two directions at once, not because it was outfought for it."
 pd_bohemia_dhe.1.historical_info: "The Bohemian estates' rights were not invented in the quarrel that destroyed them. The Bohemian Confession of 1575 and the Letter of Majesty that Rudolf II signed on 9 July 1609 put religious liberty and the estates' right to be consulted into writing - concessions wrung from a Habsburg who needed Bohemian support against his own brother Matthias.\n\nWhat broke the settlement was not a new demand but the crown's refusal to honour an old one. In 1617 Catholic regents closed Protestant chapels built on church land at Broumov and Hrob; the estates held that the Letter forbade exactly this. Both sides believed they were defending the constitution."
 pd_bohemia.1.historical_info: "On 23 May 1618 the Protestant estates threw the regents Vilem Slavata and Jaroslav Borita of Martinice, and the secretary Filip Fabricius, from a window of the Bohemian Chancellery some seventeen metres above the moat. All three survived. Catholics credited the intervention of angels; Protestants credited a heap of refuse.\n\nThe estates deposed Ferdinand and elected Frederick V of the Palatinate. He held the crown for one winter - the Winter King - and lost it at the White Mountain outside Prague on 8 November 1620, in a battle of roughly two hours. Twenty-seven leaders of the revolt were executed in the Old Town Square on 21 June 1621.\n\nThis quarrel is where the Thirty Years' War begins. It ends thirty years later with perhaps a third of the German population dead."
 pd_bohemia.2.historical_info: "Charles VI died in October 1740 leaving a daughter and no son, and the Pragmatic Sanction his whole diplomacy had purchased was repudiated across Europe within months. A Franco-Bavarian army took Prague on 26 November 1741, and Charles Albert of Bavaria was crowned King of Bohemia there on 19 December; a considerable part of the Bohemian nobility swore to him.\n\nMaria Theresa retook the city in December 1742 and never forgave those who had knelt. She had herself crowned in Prague in 1743 and made a point of the coronation.\n\nThis is also the answer to why Silesia was takeable at all. Frederick II did not defeat Austria for it - he took it while Austria was being pulled apart from two directions at once."
 pd_bohemia.10.historical_info: "The Bohemian Landtag was a constitutional body, not a petition. It voted taxes, and a king who wanted an army had to ask it and be refused or obeyed. That is why the quarrel over its rights was never merely ceremonial: whoever won it decided whether Bohemia could be governed without consent.\n\nBoth historical crowns eventually answered with soldiers rather than charters, and both were answering the same question this diet asks."
 pd_bohemia.20.historical_info: "News of the defenestration reached the imperial court within days and London within about a month, and every chancery in Europe read it the same way: not as a riot, but as a kingdom declaring that its king had forfeited the crown.\n\nWhat made it a continental event rather than a Bohemian one was that everybody had an interest in who ruled Bohemia. Its king was an Elector, and its vote helped choose the Holy Roman Emperor."
 pd_bohemia.100.historical_info: "This is the settlement Rudolf II actually signed. The Letter of Majesty of 1609 conceded religious liberty and confirmed the estates' privileges, because Rudolf needed Bohemia against his brother more than he needed to win the argument.\n\nIt bought nine years. The concession was real and so was its cost: a crown that had to ask could be refused, and in 1618 it was."
 pd_bohemia.101.historical_info: "This is the settlement Ferdinand II imposed. The Verneuerte Landesordnung of 10 May 1627 made the Bohemian crown hereditary in the Habsburg line, put German on equal footing with Czech, made Catholicism the only lawful faith, and reduced the estates from a body that consented to one that was informed.\n\nRoughly half the noble land in Bohemia changed hands, confiscated from the defeated and granted to men who owed everything to the grantor - Albrecht von Wallenstein foremost among them. Bohemian self-government did not return for two centuries.\n\nIt worked. That is the uncomfortable part."
 pd_brandenburg_dhe.1.historical_info: "Brandenburg's military reputation is very late and was not obvious from its position. The Hohenzollerns bought the margraviate in 1415, when Sigismund granted it to Frederick VI of Nuremberg against a loan he could not repay, and for two centuries it was poor, sandy and unremarkable - the Streusandbuchse des Heiligen Romischen Reiches, the sandbox of the Holy Roman Empire.\n\nNothing about 1415 predicted 1740. The army came first and the state was built to pay for it, not the other way round."
 pd_brandenburg_dhe.2.historical_info: "Berlin in 1600 was a modest twin town, Berlin and Colln together holding perhaps twelve thousand people, and the Thirty Years' War cut that roughly in half.\n\nIt became a garrison town under the Great Elector and a garrison city under Frederick William I, whose regiments eventually made up something like a fifth of everyone living in it. Mirabeau's line - that Prussia was not a state with an army but an army with a state - was about this arrangement."
 pd_brandenburg_dhe.3.historical_info: "The drill that made the reputation is eighteenth-century. Leopold I of Anhalt-Dessau, the Old Dessauer, gave the infantry the iron ramrod and the cadenced march in the 1710s and 1720s, and the result was a line that could fire appreciably faster than anyone it met.\n\nFrederick II inherited that army from his father in 1740 along with a full treasury, and used both within months."
 pd_brandenburg_dhe.4.historical_info: "The real union came by inheritance and took a century and a half to secure. Albrecht of Hohenzollern, the Order's last Grand Master, secularised its Prussian lands in 1525 and held the new Duchy of Prussia as a fief of the Polish crown. Brandenburg inherited it in 1618 when Albrecht Friedrich's line failed.\n\nIt was still Polish-held in law. Sovereignty was bought with the Treaty of Wehlau in 1657 and confirmed at Oliva in 1660 - the Great Elector's price for changing sides in a Northern war."
 pd_brandenburg_dhe.5.historical_info: "This is the reverse of what happened, and it is worth saying so. The Teutonic Order did not absorb Brandenburg; the Order's own power broke at Grunwald in 1410 and was formalised away in the Second Peace of Thorn in 1466, which made the Grand Master a vassal of Poland.\n\nBy 1525 the Order's Prussian branch had dissolved itself into a duchy, and the Hohenzollerns were on both sides of that transaction."
 pd_brandenburg_dhe.6.historical_info: "Frederick William I's General Directory of 1723 merged the separate war and domains administrations of every province into one body answering to the king. It is the least romantic thing in this story and possibly the most important: it made a scattered inheritance - Brandenburg, Prussia, Cleves, Mark, pieces of Pomerania - collectable and payable as a single state.\n\nThe army was the visible half. The filing was the half that made it affordable."
 pd_brandenburg_dhe.7.historical_info: "Joachim I Nestor, Elector from 1499 to 1535, founded the Kammergericht as a standing court, held to Rome against the Reformation spreading through his own territory, and divided his lands in his will - the habit that kept Brandenburg small for another century."
 pd_brandenburg_dhe.8.historical_info: "Joachim II Hektor took communion in both kinds at Spandau on 1 November 1539, which is the moment Brandenburg becomes Lutheran. He did it carefully: he kept much of the old liturgy, avoided joining the Schmalkaldic League, and gave the Emperor as little to object to as possible.\n\nBrandenburg's Reformation was a negotiation, not a rupture."
 pd_brandenburg_dhe.9.historical_info: "Johann Sigismund, Elector from 1608 to 1619, collected the inheritance that made Brandenburg-Prussia a European problem: Cleves and Mark in the west by the Treaty of Xanten in 1614, and the Duchy of Prussia in the east in 1618.\n\nHe also converted to Calvinism in 1613 while his subjects remained Lutheran, and could not carry them with him. The dynasty and its people held different confessions for a century, which is one reason Brandenburg practised toleration before it believed in it."
 pd_brandenburg_dhe.10.historical_info: "Friedrich Wilhelm, Elector from 1640 to 1688 and called the Great Elector, took over a ruined country and built the machine. The Recess of 1653 traded the nobility's tax consent for confirmed authority over their peasants - the bargain that funded a standing army. Fehrbellin in 1675 beat a Swedish force and gave Brandenburg a military reputation for the first time.\n\nThe Edict of Potsdam of 1685 invited Huguenots expelled from France; some twenty thousand came, and by 1700 roughly a fifth of Berlin was French-speaking. Toleration here was a recruitment policy for an underpopulated state, and it worked."
 pd_brandenburg_dhe.11.historical_info: "Frederick III crowned himself at Konigsberg on 18 January 1701 - and crowned himself, deliberately, rather than be crowned. The Emperor's consent was bought with troops for the coming war over the Spanish succession.\n\nThe title was King IN Prussia, not OF Prussia, because West Prussia was still Polish and the Emperor would not concede a kingdom inside the Empire. It became King of Prussia only after the first partition of Poland in 1772. The whole thing was a point of precedence, and within two generations it was the name of a great power."
 pd_brandenburg.10.historical_info: "The Hohenzollerns did look east, and they got there - but by purchase, marriage and inheritance rather than by campaign. The Neumark was bought back from the Teutonic Order in 1455 because the Order could not pay its mercenaries.\n\nBrandenburg's expansion was for most of its history a matter of outliving other dynasties and having the documents ready."
 pd_brandenburg.1.historical_info: "Sigismund granted Brandenburg to Frederick VI of Nuremberg in 1415 against a loan of 400,000 Hungarian gulden he had no way of repaying, and the Hohenzollerns held it for the next five hundred and three years.\n\nIt was not a prize. The Mark was poor, sandy and exposed, and contemporaries did not regard the transaction as the founding of anything."
 pd_brandenburg.2.historical_info: "Brandenburg did eventually get Prussia, and not this way. The Duchy fell in by inheritance in 1618 when the Prussian Hohenzollern line failed - no campaign, no siege, a succession that had been arranged decades earlier and simply came due.\n\nThe alternative history in which the moment is missed is not far-fetched: the inheritance depended on a marriage, a minority, and Poland's willingness to confirm it."
 pd_brandenburg.100.historical_info: "The Order's isolation was largely self-inflicted. Lithuania accepted Christianity in 1387, which removed the crusade's reason to exist, and the Order went on fighting Christians for territory while still calling it a mission - so the western recruits and the papal sympathy thinned out together.\n\nBy the 1450s its own subjects had organised against it. The Prussian Confederation of towns and gentry, formed in 1440, appealed first to the Emperor and then simply offered Prussia to the King of Poland. An enemy without friends is usually one that has spent them."
 pd_brandenburg.101.historical_info: "Brandenburg was not a state anyone watched in this century. The Hohenzollerns spent their first decades in the Mark subduing their own nobility - Frederick I broke the Quitzow family's castles in 1414 with a borrowed siege gun - and the margraviate stayed poor and thinly held long after.\n\nMobilisation here was news precisely because so little was expected of the place."
 pd_brandenburg.102.historical_info: "Brandenburg's quarrels in this century were mostly with Pomerania, over the Stettin inheritance, and they ran for decades without deciding much. A neighbour massing troops on the Mark's border was a real danger and not yet an existential one.\n\nThe power that actually threatened everyone in this region was insolvency: the Order lost Prussia to unpaid mercenaries, not to a rival army."
 pd_brandenburg.108.historical_info: "This is how the Order was actually broken, and Brandenburg was not the one who did it. In 1454 the Prussian Confederation - the Order's own towns and gentry - renounced allegiance and offered Prussia to Casimir IV of Poland, who accepted and annexed it by act. The Thirteen Years' War followed.\n\nBrandenburg's part was opportunistic rather than martial. It took the Neumark off the Order in 1455, at a price the Order was in no position to refuse. The coalition did the fighting."
 pd_brandenburg.109.historical_info: "Poland accepted this kind of invitation in 1454 and found out what it cost. The war against the Order ran thirteen years, emptied both treasuries, and was decided by sieges and unpaid soldiers rather than by any campaign either side had planned.\n\nPoland did win - West Prussia outright and the Grand Master's homage. It simply took far longer than anyone offering the alliance had suggested."
 pd_brandenburg.103.historical_info: "Brandenburg's gains in the Baltic came from the Order's insolvency rather than from its own campaigns. It bought the Neumark back in 1455 because the Order could not pay its mercenaries, and its actual wars - against Pomerania over the Stettin succession from 1468 - ended inconclusively after four years.\n\nThe century's decisive war in Prussia was fought by Poland, not from Berlin, and it took thirteen years to finish."
 pd_brandenburg.117.historical_info: "The Order's wars in the Baltic were real and mostly ended badly. The Prussian Confederation of towns and gentry revolted in 1440 and called in Poland; the resulting Thirteen Years' War of 1454-1466 bankrupted the Order and ended at the Second Peace of Thorn with the Grand Master a Polish vassal.\n\nBy then the crusade had no pagans left to convert - Lithuania had been Christian since 1387 - and the Order was fighting Christians for territory while still calling it a mission."
 pd_brandenburg.110.historical_info: "Alliances in the fifteenth-century Baltic were held together by money and dissolved by the lack of it. The Order's war effort collapsed when its Bohemian and Silesian mercenaries went unpaid and began selling fortresses to the enemy, and its allies drifted off for much the same reason.\n\nA pact honoured was worth something here precisely because so many were not."
 pd_brandenburg.104.historical_info: "The power that emerged in the Baltic in this century was Poland, not Brandenburg. The Second Peace of Thorn in 1466 gave the Polish crown West Prussia outright and left the Grand Master a vassal owing homage, and the Order never regained the initiative.\n\nBrandenburg's turn came much later and by an entirely different route: inheritance in 1618, and sovereignty bought from Poland in 1657."
 pd_brandenburg.105.historical_info: "Victory in this war was a matter of money rather than battles. The Thirteen Years' War of 1454-1466 had few decisive engagements and a great many sieges, and its single most important transfer was a sale: in 1457 the Order's unpaid Bohemian mercenaries handed over Marienburg, its own headquarters, to the King of Poland in lieu of wages.\n\nThe Grand Master left by the back door and moved the Order's seat to Konigsberg, where it stayed."
 pd_brandenburg.107.historical_info: "Campaigns in this region failed from exhaustion more often than from any single defeat. Brandenburg's war against Pomerania from 1468 ran four years and settled the succession only partly; the Order's thirteen-year war against Poland ended with both sides insolvent and one of them a vassal.\n\nThere was rarely a battle to blame afterwards. There was usually a treasury."
 pd_brandenburg.111.historical_info: "The Order's power was broken at Grunwald - Tannenberg - on 15 July 1410, where the Grand Master Ulrich von Jungingen and most of the leadership were killed in a single afternoon by a Polish-Lithuanian army.\n\nMarienburg itself held out that autumn, so the Order survived. It never again fielded an army that decided anything."
 pd_brandenburg.112.historical_info: "The Order was written off more than once before it actually failed. Heinrich von Plauen held Marienburg through the siege that followed Grunwald in 1410 and saved the Order's existence; it recovered enough to fight on for another fifty years.\n\nWhat finished it was not a battle but money - mercenaries it could not pay, and towns that preferred Poland's taxes to its own."
 pd_brandenburg.113.historical_info: "The Order's submission was to Poland, not to Brandenburg. The Second Peace of Thorn in 1466 ceded West Prussia outright and made the Grand Master a vassal owing homage to the Polish crown - a status the Order spent the next sixty years trying and failing to escape."
 pd_brandenburg.114.historical_info: "The homage happened, in the wrong direction and in a different city. On 10 April 1525 Albrecht of Hohenzollern, the last Grand Master, knelt in the market square of Krakow to Sigismund I of Poland and received the secularised Duchy of Prussia as a hereditary fief.\n\nThe Order's Prussian state did not fall to a rival. It was dissolved by its own Grand Master, who kept the land and changed its name - and he was a Hohenzollern, which is how Brandenburg ended up with the claim at all."
 pd_brandenburg.115.historical_info: "The Order never came close to this. Its high-water mark against Brandenburg was the purchase of the Neumark in 1402, and it sold that back in 1455 to pay soldiers.\n\nBy the time the two houses were seriously entangled, the Grand Master was himself a Hohenzollern."
 pd_brandenburg.116.historical_info: "An Elector of Brandenburg never swore fealty to a Grand Master. The relationship ran the other way and then dissolved entirely: in 1525 the Order's Prussian branch became a duchy under a Hohenzollern, and in 1618 that duchy passed to Berlin."
 pd_brandenburg.299.historical_info: "The Holy Roman Empire was not overthrown by Prussia in a war. It was dissolved on 6 August 1806 by Francis II, who abdicated the imperial title rather than let Napoleon inherit it, and by then it had been unable to compel its own members for a century and a half.\n\nThe mod compresses into a confrontation what history did by attrition: the Peace of Westphalia in 1648 left the princes sovereign in all but name, and everything after that was bookkeeping."
 pd_brandenburg.200.historical_info: "Silesia was the richest province the Habsburgs owned - linen, coal, iron, and about a tenth of the whole monarchy's revenue from a twentieth of its area. It had been Habsburg since 1526 and Bohemian for two centuries before that.\n\nFrederick II took it in the winter of 1740-41 and held it through three wars over twenty-three years, and its loss defined Austrian policy until 1866. In real time this is 1740; in this mod it arrives two centuries early."
 pd_brandenburg.201.historical_info: "The quiet decades were real and they were the point. Frederick William I raised the army from 38,000 to over 80,000 men, filled the treasury and fought almost nobody, and was mocked across Europe as the Soldier King with a parade-ground army that never marched.\n\nHis son used it within six months of inheriting it."
 pd_brandenburg.202.historical_info: "The smaller German states spent the century between 1740 and 1866 looking for a protector against Berlin, and the available protectors were Vienna and Paris. Both eventually lost, and the states that had chosen them were annexed - Hanover, Hesse-Kassel, Nassau and Frankfurt in 1866, for backing Austria."
 pd_brandenburg.203.historical_info: "Bismarck's phrase, to the Prussian budget committee on 30 September 1862: the great questions of the day are not settled by speeches and majority decisions - that was the mistake of 1848 and 1849 - but by iron and blood.\n\nHe was arguing for an illegal military budget to a hostile parliament, and the speech was considered a disaster at the time. He spent the next years making it true in retrospect. In real time this is 1862; the mod says it three centuries early."
 pd_brandenburg.204.historical_info: "The North German Confederation was founded in 1867, after Prussia had beaten Austria in seven weeks and annexed four of the states that had sided with it. Twenty-two states north of the Main, a constitution written largely by Bismarck, a federal parliament elected by universal male suffrage, and a presidency permanently attached to the King of Prussia.\n\nThe Empire of 1871 is this constitution with the southern states added."
 pd_brandenburg.205.historical_info: "Mastery of the north was settled at Koniggratz on 3 July 1866, in a single day, by an army that arrived on the field in three separate columns connected by telegraph and moved by rail. Austria was excluded from Germany permanently, and the German Confederation of 1815 was dissolved."
 pd_brandenburg.206.historical_info: "It nearly happened twice. The coalition of 1756 - Austria, France, Russia, Saxony and Sweden - was assembled specifically to partition Prussia, and by 1761 Berlin had been occupied and Frederick was carrying poison.\n\nIn 1850 Prussia did back down, at Olmutz, and abandoned its first attempt at a German union under Berlin. Contemporaries called it the humiliation of Olmutz; Bismarck defended it and remembered it."
 pd_brandenburg.207.historical_info: "Prussian reverses were usually recoverable because the state behind the army was solvent and the army could be rebuilt. That was the actual advantage - not discipline in the field, but the ability to lose a campaign and field another the following spring."
 pd_brandenburg.208.historical_info: "Silesia was ceded at Breslau in June 1742, reconfirmed at Dresden in 1745 after Austria tried to take it back, and confirmed a third time at Hubertusburg in 1763 after a war that nearly destroyed Prussia to keep it.\n\nThree treaties for one province. Maria Theresa signed all three and accepted none of them."
 pd_brandenburg.209.historical_info: "The customs union was the quieter half of unification and arguably the decisive one. Prussia built it outward from its own 1818 tariff law, absorbing neighbours one treaty at a time, and the states that joined found their economies reoriented toward Berlin years before any political question was put to them.\n\nThe historian's phrase for it is that Germany was united by the customs union before it was united by the army."
 pd_brandenburg.210.historical_info: "The Zollverein came into force on 1 January 1834: eighteen states, some twenty-three million people, internal tariffs abolished and the external tariff set in Berlin.\n\nAustria was excluded from the beginning and never got in, despite trying repeatedly, because Prussia held the veto and understood exactly what it was worth. Joining meant prosperity now and a decision already taken about who Germany would belong to. In real time this is 1834."
 pd_brandenburg.211.historical_info: "States joined the Zollverein for revenue and convenience, and discovered afterwards what they had signed. Baden and Nassau came in 1836, Frankfurt in 1836, Brunswick in 1841, Hanover and Oldenburg in 1854.\n\nBy 1866 the economic map of Germany was already Prussian, and the war only confirmed it."
 pd_brandenburg.212.historical_info: "Refusal was tried. Hanover, Brunswick and Oldenburg built the rival Steuerverein in 1834 and held out for twenty years; the Hanseatic cities stayed outside for decades on free-trade principle.\n\nThe Steuerverein collapsed into the Zollverein in 1854. Hanover was annexed outright in 1866."
 pd_brandenburg.213.historical_info: "Vienna saw it and could not answer it. Austria's economy was protectionist and its territories largely outside Germany, so joining the Zollverein on Prussia's terms was impossible and building a rival was beyond it.\n\nSchwarzenberg's attempt at a counter-union in 1849-1850 produced the confrontation at Olmutz, which Austria won, and changed nothing underneath."
 pd_brandenburg.214.historical_info: "Austria brought the quarrel over Schleswig and Holstein - provinces the two powers had taken from Denmark together in 1864 - to the Federal Diet on 1 June 1866 and asked the German states to mobilise against Prussia. Bismarck had been waiting for precisely that.\n\nPrussia declared the Confederation dissolved, marched into Holstein, and the war began within a fortnight."
 pd_brandenburg.215.historical_info: "The 1866 war lasted seven weeks and was decided in one afternoon at Koniggratz. Austria was not partitioned or occupied - Bismarck overruled his king and his generals to obtain a lenient peace at Prague, wanting Austria neutral in the next war rather than vengeful.\n\nFour years later, when France declared war, Austria stayed out. That is what the leniency bought."
 pd_brandenburg.216.historical_info: "The confrontation between Berlin and Vienna was not a sudden crisis; it was the whole nineteenth century in Germany, and the name contemporaries gave the question was whether unification would be kleindeutsch - little Germany, without Austria - or grossdeutsch, with it.\n\n1866 answered it by force after the parliament at Frankfurt in 1848 had failed to answer it by debate."
 pd_brandenburg.217.historical_info: "Germans called it the Bruderkrieg, the brothers' war, and it divided the Confederation almost exactly: Saxony, Hanover, Bavaria, Wurttemberg, Baden and Hesse for Austria, most of the north for Prussia.\n\nIt settled in seven weeks a question that had been open since 1815, and the losing states north of the Main ceased to exist."
 pd_brandenburg.220.historical_info: "Austria came closest to this in 1850, and won. At Olmutz on 29 November, faced with Austrian and Russian pressure, Prussia abandoned its Erfurt Union and accepted the restoration of the old Confederation under Vienna.\n\nIt was a complete diplomatic victory and it lasted sixteen years. What Austria could not do was change anything underneath it - the customs union kept growing, and the next confrontation was fought on ground Prussia had chosen."
 pd_brandenburg.221.historical_info: "Prussia had been beaten badly enough to be dismantled before, and by France rather than Austria: after Jena and Auerstedt in 1806 it lost half its territory at Tilsit and was held to an army of 42,000 men.\n\nThe reforms that followed - Stein, Hardenberg, Scharnhorst - were made under occupation, and the army that fought in 1813 was built by a state that had already lost everything once."
 pd_brandenburg.300.historical_info: "The southern states were secured before anyone needed them. In August 1866, immediately after beating them, Bismarck signed secret defensive treaties with Bavaria, Wurttemberg and Baden placing their armies under Prussian command in the event of war.\n\nSo when France declared war in 1870, the states that had fought against Prussia four years earlier marched with it. That was arranged in advance, and France did not know."
 pd_brandenburg.301.historical_info: "The French phrase after 1866 was revanche pour Sadowa - revenge for Koniggratz, a battle France had not fought in. Napoleon III had expected the two German powers to exhaust each other and to be paid for his neutrality with the Rhineland or Luxembourg.\n\nHe got nothing, and his own position at home never recovered from having asked."
 pd_brandenburg.302.historical_info: "The Hohenzollern candidacy for the Spanish throne was withdrawn on 12 July 1870 and France had already won the quarrel. Paris then overreached: the ambassador Benedetti was sent to Bad Ems to demand that Wilhelm I guarantee the renunciation forever.\n\nWilhelm declined politely and had Abeken telegraph an account to Bismarck. Bismarck shortened it - he cut nothing untrue and added nothing, but the courtesies went - and released it to the press on 13 July. He said it would work on the Gallic bull like a red rag. In real time this is 1870."
 pd_brandenburg.303.historical_info: "The dispatch did more work in Germany than in France. A French demand that a German king apologise, read aloud in every German paper, made the 1866 treaties politically effortless: the southern parliaments voted the war credits their populations were already demanding.\n\nBismarck needed the south to want the war, not merely to be obliged to join it. That is what the edit purchased."
 pd_brandenburg.304.historical_info: "France declared war on 19 July 1870, six days after the dispatch was published, in the manner Bismarck had designed - as the aggressor, alone, against a Germany that looked like the injured party.\n\nThe Chamber voted for it against ten opposing voices. Within six weeks the Emperor who declared it was a prisoner."
 pd_brandenburg.305.historical_info: "The war was decided in six weeks. The French army was cut in two, half besieged at Metz, and Napoleon III surrendered with 104,000 men at Sedan on 2 September 1870.\n\nIt did not end there - the Republic proclaimed on 4 September fought on through the winter, and Paris was besieged until 28 January 1871. The victory was quick; the war was not."
 pd_brandenburg.306.historical_info: "The German Empire was proclaimed in the Hall of Mirrors at Versailles on 18 January 1871, in an occupied palace, in a country still being fought over, at a ceremony of German princes with no civilian government present.\n\nThe date was chosen: 18 January 1701 was the day the first Hohenzollern crowned himself King in Prussia at Konigsberg. Exactly a hundred and seventy years.\n\nWilhelm hated it. He wanted Emperor of Germany, which the princes would not grant, and accepted German Emperor - a title over a federation rather than over a country - and left the ceremony without speaking to Bismarck."
 pd_brandenburg.307.historical_info: "France did not repel the invasion, and the terms it accepted set the next seventy years. The Treaty of Frankfurt in May 1871 took Alsace and most of Lorraine and imposed an indemnity of five billion francs.\n\nParis paid it early, in three years, out of national subscription. The provinces it did not get back until 1918, and the wanting of them back is in the background of everything that follows."
 pd_brandenburg.308.historical_info: "The nearest thing to a Prussian collapse before an enemy in the west is 1806: Jena and Auerstedt fought on one day, the army destroyed, Berlin occupied within a fortnight, the state reduced by half at Tilsit.\n\nNothing comparable happened in 1870. But it had happened, within living memory of the men who planned 1870, which is part of why they planned it so carefully."
 pd_brandenburg.309.historical_info: "The Luxembourg crisis of 1867 was the near-war between the two. Napoleon III tried to buy the Grand Duchy from the King of the Netherlands as compensation for 1866; Bismarck let the negotiation become public and let German nationalist opinion do the rest.\n\nIt was settled at the London Conference on 11 May 1867 - Prussian garrison withdrawn, Luxembourg neutralised, fortress dismantled - and both sides went away certain the real quarrel was still ahead."
 pd_brandenburg.310.historical_info: "Both armies rearmed and the French infantry weapon was the better one: the Chassepot outranged the Prussian Dreyse needle gun by a wide margin, and the mitrailleuse had no German equivalent.\n\nPrussia won anyway, on artillery and on movement - Krupp steel breech-loaders against French bronze muzzle-loaders, and a general staff that had spent a decade learning to move armies by railway timetable. The lesson drawn everywhere afterwards was that the staff work mattered more than the rifle."
 pd_brandenburg.311.historical_info: "The years between 1866 and 1870 were a slow diplomatic breakdown with a press campaign on both sides, and both governments had domestic reasons to want the quarrel: Napoleon III needed a success, and Bismarck needed the southern states frightened into a union they had not yet agreed to.\n\nThe spark, when it came, was a vacant Spanish throne that neither country had any real interest in."
 STATIC_MODIFIER_NAME_PD_boh_confirmed_privileges: "Confirmed Privileges"
 STATIC_MODIFIER_DESC_PD_boh_confirmed_privileges: "A charter the crown signed to get its estates out of the room. It does not expire, and it never arrives alone."
 PD_boh_start_nobles_tt: "The nobility of Bohemia is discontented with the crown"
 pd_bohemia_dhe.1.title: "The Estates Present Their Grievances"
 pd_bohemia_dhe.1.entry: "(PD) - The Estates Present Their Grievances"
 pd_bohemia_dhe.1.desc: "The estates of Bohemia have come to the crown with a list, as they are entitled to, and the crown has read it and set it down.\n\nThey want their charter confirmed in writing. They want the offices of the kingdom held by Bohemians. They want to be asked before they are taxed. None of it is new and none of it is unreasonable, which is precisely what makes refusing it expensive.\n\nThe nobility has gone home without an answer. That is not the same as a no, but they will not read it as anything else."
 pd_bohemia_dhe.1.a: "Let them wait."
 pd_bohemia_dhe.1.a.entry: "Let them wait."
 PD_boh_start_grievance_tt: "The estates have laid their grievances before the crown and been refused"
