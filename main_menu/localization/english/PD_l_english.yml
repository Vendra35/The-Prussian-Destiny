 cb_PD_hegemony: "German Hegemony"
 cb_PD_hegemony_desc: "The time has come to decide the fate of the German people. We no longer recognize the Emperor's right to dictate our future. This is a struggle for the very soul of the Empire?a war to decide who truly leads the German nation.\n\nVictory in this [casus_belli|e] requires proving our undeniable superiority on the field of battle against the Imperial forces."
 
 war_goal_PD_war_goal_prussian_hegemony: "Germanic Supremacy"
 war_goal_PD_war_goal_prussian_hegemony_desc: "Our [war_goal|e] is to utterly crush the Emperor's armies in battle, proving once and for all that the era of the old Imperial order is over and the age of Berlin has begun."
 
 PD_prussian_ascension_take_regions_entry: "Annex Claimed Territories"
 PD_prussian_ascension_take_regions_entry_short: "Annex Claimed Territories"
