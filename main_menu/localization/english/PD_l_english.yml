l_english:

 # ==============================================================================
 # -------------------------- SITUATION 1: THE PRUSSIAN DESTINY -------------------
 # ==============================================================================

 # --- EVENT 10 (SITUATION BA?LATICI - DISASTER SONRASI) ---
 pd_brandenburg.10.title: "The Marcher State's Destiny"
 pd_brandenburg.10.desc: "The turmoil that plagued our realm has finally subsided. With internal order restored and the nobility brought to heel, the House of Hohenzollern can finally look beyond our borders.\n\nThe Baltic coastline calls to us, as does the isolated territory of Prussia. If we are to secure our legacy, we must act decisively before the turn of the century."
 pd_brandenburg.10.a: "Our borders must expand."

 # --- DESTINY EVENT 1 (SITUATION SONUCU / HAR?TA BOYAYICI) ---
 pd_brandenburg.1.title: "The Rise of the Hohenzollern"
 pd_brandenburg.1.desc: "For centuries, the Margraviate of [GetCountry('BRA').GetName] was but a plaything of the Empire. But the sands are shifting. The House of Hohenzollern has looked toward the Baltic, seeing not just land, but a destiny carved in steel and discipline.\n\nFrom the ports of Pomerania to the fortresses of K?nigsberg, the North shall tremble as a new power awakens to claim its rightful place among the Great Powers."
 pd_brandenburg.1.a: "Ein Volk, ein Reich, ein Schicksal!"

 # --- DESTINY EVENT 2 (OYUNCU BA?ARISIZ OLDU?UNDA) ---
 pd_brandenburg.2.title: "A Missed Opportunity"
 pd_brandenburg.2.desc: "The moment has passed. The Baltic coast remains out of our grasp, and the Prussian lands are still beyond our control. Our rivals will mock our inaction, and our people will question our resolve.\n\nWe have failed to seize our destiny, and now we must live with the consequences."
 pd_brandenburg.2.a: "We will rise again, stronger than before."

 # --- G?ZL? EVENT SE?ENEKLER? (Log Hatalar?n? ?nlemek ??in) ---
 pd_brandenburg.998.a: "Hidden Action"
 pd_brandenburg.999.a: "Hidden Action"
 PD_brandenburg_dhe_free_buildings: "Royal Decree"

 # ----------------------- SAVA? HAZIRLI?I VE D?PLOMAS? EVENTLER? -----------------------
 pd_brandenburg.100.title: "Isolating the Target"
 pd_brandenburg.100.desc: "Our ambitions in the north require a clear battlefield. We cannot afford the complications of minor alliances dragging us into unwanted conflicts. The Margrave has ordered our diplomats to sever ties with any nation that might stand in the way of our imminent expansion."
 pd_brandenburg.100.a: "Clear the diplomatic web."

 pd_brandenburg.101.title: "The Eagle Stirs"
 pd_brandenburg.101.desc: "Reports from Berlin indicate that the state of Brandenburg is mobilizing its forces. Diplomats are being recalled, alliances are being broken, and the Prussian ambition is no longer just a whisper in the court. War is coming to the region."
 pd_brandenburg.101.a: "We shall watch closely."

 pd_brandenburg.102.title: "The Marcher Lord's Gaze"
 pd_brandenburg.102.desc: "Ominous news has arrived at our court. [GetCountry('BRA').GetName] has severed key diplomatic ties and their armies are massing near our borders. It is clear that we are the target of their so-called 'Prussian Destiny'. We must prepare for the worst."
 pd_brandenburg.102.a: "To arms! We will defend our lands!"

 # --- M?TTEF?K ARAMA VE RAK?P KONTROL? (108 ve 109) ---
 pd_brandenburg.108.title: "Diplomatic Maneuvers"
 pd_brandenburg.108.desc.1: "Our intended target has powerful friends, but also bitter enemies. We have identified a nation that shares our rivalry with them. Perhaps a temporary alliance of convenience would secure our victory?"
 pd_brandenburg.108.desc.2: "Our target stands alone, or their enemies are too distant to be of use. We must rely solely on our own Prussian discipline to see this conquest through."
 pd_brandenburg.108.a: "Send an envoy to their rival. We strike together!"
 pd_brandenburg.108.b: "We need no help. Prussian steel is enough."
 pd_brandenburg.108.c: "So be it. We march alone."

 pd_brandenburg.109.title: "An Envoy from Berlin"
 pd_brandenburg.109.desc: "An envoy from [GetCountry('BRA').GetName] has arrived at our court with a proposal. They intend to march upon our mutual rival and ask for our direct military support in the coming conflict. This is an opportunity to crush our enemy, but it will tie our fate to the rising power in the North."
 pd_brandenburg.109.a: "We will answer the call! Death to our rival!"
 pd_brandenburg.109.a.tt: "We will automatically join [GetCountry('BRA').GetName]'s war."
 pd_brandenburg.109.b: "We have our own affairs to attend to."

 # --- SAVA? ?LANI VE OTOMAT?K KATILIM (103 ve 110) ---
# --- Brandenburg Savaş açma eventi 103 ---
 pd_brandenburg.103.title: "The Drums of War"
 pd_brandenburg.103.desc: "The preparations are complete. Our armies are drilled, our diplomats have set the stage, and the target is isolated. The time has come to cross the border and take what rightfully belongs to our glorious state by iron and blood."
 pd_brandenburg.103.a: "Gott mit uns! Declare war!"
 pd_brandenburg.103.b: "We are not ready yet. Let us gather our strength... (Postpone for 20 years)"

# --- Teuton Savaş açma eventi 117 ---
 pd_brandenburg.117.title: "The Crusade Resumes"
 pd_brandenburg.117.desc: "The Hochmeister has decreed it: our holy mission in the Baltic is far from over. The knights have gathered, their armor gleaming beneath the banners of the black cross. Our target is weak and ripe for righteous conquest. It is time to ride forth and bring them into the fold of the Order."
 pd_brandenburg.117.a: "For the Order! Declare war!"
 pd_brandenburg.117.b: "Hold the charge. We must consolidate first... (Postpone for 20 years)"

 pd_brandenburg.110.title: "Honoring the Pact"
 pd_brandenburg.110.desc: "[GetCountry('BRA').GetName] has formally declared war on our mutual rival, just as we agreed. Their banners are marching, and it is time for us to uphold our end of the bargain. Sound the trumpets!"
 pd_brandenburg.110.a: "Into the fray!"

 # --- SAVA? SONU?LARI: BA?ARI (104 ve 105) ---
 pd_brandenburg.105.title: "Victory in the North"
 pd_brandenburg.105.desc: "Our recent campaign was a resounding success. The enemy has been crushed, and the lands we claimed are now firmly under our administration. Our military prestige has soared, and Europe now recognizes the true strength of our armies."
 pd_brandenburg.105.a: "A glorious day for our nation!"

 pd_brandenburg.104.title: "A New Power Emerges"
 pd_brandenburg.104.desc: "[GetCountry('BRA').GetName] has emerged victorious in their recent conflict. Their disciplined armies have secured new territories, and the balance of power in the region has decisively shifted in their favor. The Margrave is no longer just an Elector; he is a conqueror."
 pd_brandenburg.104.a: "They grow too powerful."

 # --- SAVA? SONU?LARI: BA?ARISIZLIK (106 ve 107) ---
 pd_brandenburg.107.title: "A Bitter Defeat"
 pd_brandenburg.107.desc: "The campaign was a disaster. Despite the discipline of our troops, we failed to secure our objectives. The expansion has been halted, our armies are battered, and our prestige has taken a severe blow. We must retreat and lick our wounds."
 pd_brandenburg.107.a: "We will remember this humiliation."

#  pd_brandenburg.106.title: "The Eagle Grounded"
#  pd_brandenburg.106.desc: "The so-called 'Prussian Destiny' of [GetCountry('BRA').GetName] has ended in failure. Their armies were repelled, and their expansionist dreams have been shattered. The balance of power remains intact, and the Hohenzollerns have been taught a harsh lesson in humility."
#  pd_brandenburg.106.a: "A relief for the entire region."

 # --- SAVA? SONU?LARI: DEVAMI (111 ve 112) ---
 pd_brandenburg.111.title: "The Teutonic Defeat"
 pd_brandenburg.111.desc: "Word has reached our court regarding the recent conflicts in the east. The Teutonic Order, fighting on their own terms, has suffered a crushing defeat. Their armies are shattered, and their control over the Baltic coast is rapidly deteriorating. This display of weakness by the Hochmeister jeopardizes the stability of the region and forces us to re-evaluate our future ambitions in the Prussian territories."
 pd_brandenburg.111.a: "A pathetic display of incompetence."

 pd_brandenburg.112.title: "Triumph of the Black Cross"
 pd_brandenburg.112.desc: "Reports from the Baltic bring significant news. [GetCountry('TEU').GetName] has emerged victorious from their recent campaign, decisively routing their enemies. Many courts assumed the crusading knights were a fading power, but their highly disciplined forces have proven otherwise. This victory reaffirms their military grip on the region, forcing neighboring realms to carefully re-evaluate the balance of power in the east."
 pd_brandenburg.112.a: "We must monitor their ambitions closely."

 # Event 113: Töton'un Brandenburg'a boyun eğmesi (Töton'a giden event)
 pd_brandenburg.113.title: "Bowing to the Elector"
 pd_brandenburg.113.desc: "Our recent struggles have left the Order in a perilous state. With our influence waning and the Margraviate of Brandenburg asserting its dominance over the region, the Hochmeister has been presented with an ultimatum. To ensure the survival of the Teutonic state, we have no choice but to swear fealty to Brandenburg and become their fiefdom."
 pd_brandenburg.113.a: "A humiliating, yet necessary concession."

 # Event 114: Brandenburg'un Töton'u vassal yapma bildirimi (Brandenburg'a giden event)
 pd_brandenburg.114.title: "The Teutonic Submission"
 pd_brandenburg.114.desc: "Our diplomatic and strategic maneuvering has finally borne fruit! Recognizing our undeniable supremacy, the Hochmeister of the Teutonic Order has formally bent the knee. However, integrating the crusading knights required a strict reorganization. To consolidate our control and avoid unnecessary conflicts, we have forced the Order to release its former vassals and cede all far-flung territories outside the Prussian and North German realms. Stripped of its overextension, the Order is now a compact, highly focused military fiefdom that will firmly secure our ambitions in the East."
 pd_brandenburg.114.a: "The Black Cross now answers to us, and us alone."

 # Event 115: Brandenburg'un Töton'a boyun eğmesi (Brandenburg'a giden event)
 pd_brandenburg.115.title: "Subjugated by the Knights"
 pd_brandenburg.115.desc: "Our ambitions have crumbled before the disciplined might of the Teutonic Order. Having completely lost our leverage in the region, the Elector is forced to accept harsh terms of subjugation. To spare our lands from utter devastation, the Margraviate of Brandenburg is now officially a fiefdom of the Hochmeister."
 pd_brandenburg.115.a: "We will endure this dark chapter."

 # Event 116: Töton'un Brandenburg'u vassal yapma bildirimi (Töton'a giden event)
 pd_brandenburg.116.title: "The Elector Bows"
 pd_brandenburg.116.desc: "A glorious victory for the Order! We have completely outmaneuvered the arrogant lords of Brandenburg. Realizing the hopelessness of their situation, the Elector has officially sworn fealty to the Hochmeister. Brandenburg now exists merely as our fiefdom, cementing our absolute dominance over the region."
 pd_brandenburg.116.a: "Deus Vult! Our supremacy is absolute."

# --- Brandenburg DHE ---

 pd_brandenburg_dhe.1.title: "The Margraviate's Forge"
 pd_brandenburg_dhe.1.entry: "(PD) - The Margraviate's Forge (AI Only)"
 pd_brandenburg_dhe.1.desc: "The city of [ShowLocationName('brandenburg')] stands as the historic heart of our realm. It is here that the true military transformation of our state must begin. By expanding its armories and drilling the local populace, we will forge an army capable of securing our borders and fulfilling our grand ambitions."
 pd_brandenburg_dhe.1.a: "For the Margrave!"
 pd_brandenburg_dhe.1.a.entry: "For the Margrave!"
 pd_brandenburg_dhe.1.a.tt1: "We will research the [ShowAdvanceName('landsknechte')] [advance|e] for free."
 pd_brandenburg_dhe.1.a.tt2: "The military infrastructure of Brandenburg will be expanded:"
 pd_brandenburg_dhe.1.a.tt3: "Five [ShowBuildingTypeName('armory')] and [ShowBuildingTypeName('gun_smith')] [buildings|e] will be constructed in [ShowLocationName('brandenburg')] for free. A great number of [pops|e] will convert to our [faith|e] and [culture|e], and five groups of [ShowUnitDefinitionName('a_landsknechte')] will flock to our banner."
 pd_brandenburg_dhe.1.a.tt4: "The Prussian destiny takes root in the [ShowLocationName('brandenburg')]."
 pd_brandenburg_dhe.2.title: "The Iron Forge of the North"
 pd_brandenburg_dhe.2.entry: "(PD) - The Iron Forge of the North (AI Only)"
 pd_brandenburg_dhe.2.desc: "Berlin is no longer merely a city; it is to be the heart of Prussian military discipline. Behind the walls of [ShowLocationName('berlin')], our people shall learn true soldierly conduct. It is here where the armies to shake the world will be forged, and the Prussian ambition will take its shape within these streets."
 pd_brandenburg_dhe.2.a: "Discipline is Everything."
 pd_brandenburg_dhe.2.a.entry: "Discipline is Everything."
#  pd_brandenburg_dhe.2.a.tt0: "We will research the [ShowAdvanceName('bastion_advance')] [advance|e] for free."
 pd_brandenburg_dhe.2.a.tt1: "We will research the [ShowAdvanceName('unlock_men_at_arms_advance')] [advance|e] for free."
 pd_brandenburg_dhe.2.a.tt2: "Berlin's military infrastructure will be modernized:"
 pd_brandenburg_dhe.2.a.tt3: "Four [ShowBuildingTypeName('armory')] and [ShowBuildingTypeName('gun_smith')] [buildings|e] will be constructed in [ShowLocationName('berlin')] for free. A great number of [pops|e] will convert to our [faith|e] and [culture|e], and ten groups of [ShowUnitDefinitionName('a_men_at_arms')] will flock to our banner."
 pd_brandenburg_dhe.2.a.tt4: "The Prussian destiny spreads throughout Berlin."

 pd_brandenburg_dhe.3.title: "The Awakening of the State"
 pd_brandenburg_dhe.3.entry: "(PD) - The Awakening of the State (AI Only)"
 pd_brandenburg_dhe.3.desc: "As our ambitions reach beyond the Baltic shores and into the heart of the Empire, so too must our military evolve. The old ways of war are ending. In the grand squares of [ShowLocationName('berlin')], a new generation of ruthlessly disciplined pikemen is being drilled from dawn until dusk. The populace is being united under a single faith and the singular identity of Prussia, feeding the ever-hungry armories that will soon equip the most terrifying fighting force Europe has ever seen."
 pd_brandenburg_dhe.3.a: "The State exists to serve the Army."
 pd_brandenburg_dhe.3.a.entry: "The State exists to serve the Army."
 pd_brandenburg_dhe.3.a.tt1: "We will research the [ShowAdvanceName('unlock_pikemen_advance')] [advance|e] for free."
 pd_brandenburg_dhe.3.a.tt2: "Berlin will be transformed into an unrivaled military stronghold:"
 pd_brandenburg_dhe.3.a.tt3: "Five [ShowBuildingTypeName('armory')] and [ShowBuildingTypeName('gun_smith')] [buildings|e] will be constructed in [ShowLocationName('berlin')] for free. An overwhelming majority of the local [pops|e] will embrace our [faith|e] and assimilate into Prussian [culture|e]. Furthermore, twelve heavily drilled regiments of [ShowUnitDefinitionName('a_pikemen')] will be raised immediately."
 pd_brandenburg_dhe.3.a.tt4: "The Prussian Ascension has truly begun."

# Brandenburg için 1512 veya 1618 yılları arasında 2. situation başlamadan prusya formlama DHE eventi.
 pd_brandenburg_dhe.4.title: "The Prussian Inheritance"
 pd_brandenburg_dhe.4.entry: "(PD) - The Prussian Inheritance"
 pd_brandenburg_dhe.4.desc: "The time has come to formalize the ultimate union of our realms. The lands of the Teutonic Order, long held as a vassal to our Electorate, are now being fully integrated into the administrative machinery of [ShowLocationName('berlin')]. What began as a calculated subjugation has culminated in the complete annexation of the Baltic territories. By merging the disciplined martial heritage of the crusading knights with our centralized state apparatus, we have erased the fractured borders of the past. Brandenburg and Prussia are no longer divided entities; they are forged into a singular, undeniable power."
 pd_brandenburg_dhe.4.a: "The Eagles are united at last."
 pd_brandenburg_dhe.4.a.entry: "The Eagles are united at last."

# Teuton için 1512 veya 1618 yılları arasında 2. situation başlamadan prusya formlama DHE eventi.
 pd_brandenburg_dhe.5.title: "The Integration of the March"
 pd_brandenburg_dhe.5.entry: "(PD) - The Integration of the March"
 pd_brandenburg_dhe.5.desc: "The time has come to finalize our mastery over the northern realms. The Electorate of Brandenburg, long held as a subjugated fiefdom to the Order, is now being entirely dismantled and integrated into our monastic administration. The secular authority of the Elector in [ShowLocationName('berlin')] has been systematically replaced by the disciplined rule of our Komturs. By absorbing their administrative apparatus into our holy martial state, we have permanently erased the fractured borders of the past. The Mark and the Order are no longer separate entities; they are forged into a singular, undeniable power under the Black Cross."
 pd_brandenburg_dhe.5.a: "Berlin belongs to the Hochmeister."
 pd_brandenburg_dhe.5.a.entry: "Berlin belongs to the Hochmeister."

# Kültürü prusya yapma ve topraktaki insanları zorla asimile etme eventi. Sadece AI Brandenburg için geçerli olacak ve 1512 veya 1618(Time Pacing Game Rule'una göre) yılları arasında 2. situation başlamadan önce tetiklenecek.
 pd_brandenburg_dhe.6.title: "The Iron Standardization"
 pd_brandenburg_dhe.6.entry: "(PD) - The Iron Standardization (AI Only)"
 pd_brandenburg_dhe.6.desc: "A fractured realm cannot survive the coming storms. In the administrative halls of [ShowLocationName('berlin')], a radical transformation is underway. The chaotic levies and divided loyalties of the past are being systematically erased by the state. The court has decreed that faith, language, and the art of war must be unified under a single, uncompromising standard. We are not merely preparing for a campaign; we are forging a highly efficient state machinery where every citizen, every musket, and every prayer serves a singular, calculated purpose."
 pd_brandenburg_dhe.6.a: "Order must be forged, not inherited."
 pd_brandenburg_dhe.6.a.entry: "Order must be forged, not inherited."
 pd_brandenburg_dhe.6.a.tt1: "The state bureaucracy has mastered the [ShowAdvanceName('unlock_pikemen_advance')] [advance|e]."
 pd_brandenburg_dhe.6.a.tt2: "The industrial and administrative capacity of Berlin will be radically expanded:"
 pd_brandenburg_dhe.6.a.tt3: "State-funded [ShowBuildingTypeName('armory')] and [ShowBuildingTypeName('gun_smith')] [buildings|e] will be rapidly constructed in [ShowLocationName('berlin')]. A sweeping demographic standardization will assimilate the local [pops|e] into the Prussian [culture|e]. Furthermore, the first professional standing regiments of [ShowUnitDefinitionName('a_pikemen')] will be commissioned."
 pd_brandenburg_dhe.6.a.tt4: "The foundation of a modern, centralized state is laid."

# --- dhe.7: Joachim I Nestor (1499-1535) ---
 pd_brandenburg_dhe.7.title: "A New Elector Rises"
 pd_brandenburg_dhe.7.entry: "(PD) - A New Elector Rises"
 pd_brandenburg_dhe.7.desc: "The old order gives way. A new Elector, Joachim, takes the reins of Brandenburg-Prussia, determined to bring order to the nobility and strengthen the state's administration."
 pd_brandenburg_dhe.7.a: "Long live the Elector."
 pd_brandenburg_dhe.7.a.entry: "Long live the Elector."

# --- dhe.8: Joachim II Hektor (1535-1571) — Protestanlığa geçiş ---
 pd_brandenburg_dhe.8.title: "A New Faith, A New Elector"
 pd_brandenburg_dhe.8.entry: "(PD) - A New Faith, A New Elector"
 pd_brandenburg_dhe.8.desc: "Elector Joachim Hektor ascends to power. His reign will be remembered for a decisive break with Rome, as the Reformed faith takes firm root across Brandenburg-Prussia."
 pd_brandenburg_dhe.8.a: "The Elector's word is law."
 pd_brandenburg_dhe.8.a.entry: "The Elector's word is law."

# --- dhe.9: Johann Sigismund (1608-1619) — Ducal Prusya + Cleves mirası ---
 pd_brandenburg_dhe.9.title: "The Union of Two Realms"
 pd_brandenburg_dhe.9.entry: "(PD) - The Union of Two Realms"
 pd_brandenburg_dhe.9.desc: "Johann Sigismund becomes Elector, uniting the scattered Hohenzollern inheritance under a single ruler for the first time. Brandenburg and Prussia now answer to the same crown."
 pd_brandenburg_dhe.9.a: "One house, one destiny."
 pd_brandenburg_dhe.9.a.entry: "One house, one destiny."

# --- dhe.10: Friedrich Wilhelm "The Great Elector" (1640-1688) ---
 pd_brandenburg_dhe.10.title: "The Great Elector"
 pd_brandenburg_dhe.10.entry: "(PD) - The Great Elector"
 pd_brandenburg_dhe.10.desc: "Friedrich Wilhelm takes the throne. In the ashes left by decades of war, he will forge a standing army and a centralized state — the foundation upon which Prussia's future power will be built."
 pd_brandenburg_dhe.10.a: "A new discipline takes hold."
 pd_brandenburg_dhe.10.a.entry: "A new discipline takes hold."

# --- dhe.11: Friedrich I — Prusya'da Kral olan ilk isim (1701 sonrası, açık uçlu) ---
 pd_brandenburg_dhe.11.title: "A Crown for Prussia"
 pd_brandenburg_dhe.11.entry: "(PD) - A Crown for Prussia"
 pd_brandenburg_dhe.11.desc: "Friedrich rises to power and will not be content as a mere Elector. Before long, he will place a crown upon his own head, and Brandenburg-Prussia will call itself a Kingdom."
 pd_brandenburg_dhe.11.a: "Long live the King."
 pd_brandenburg_dhe.11.a.entry: "Long live the King."


