 PD_BI_TENSION_LABEL: "Franco-Prussian Tension"
 PD_bi_tension_explain_tt: "Currently the tension is: [GetSituationByKey('the_blood_and_iron').MakeScope.GetVariable('PD_franco_prussian_tension').GetValue|0]%\nMeasures how close Berlin and Paris have come to the war neither of them will admit to wanting.\n\n#T Monthly Gains#!\n$BULLET$#R +1#! every month, without exception\n\n#T Relief#!\n$BULLET$#G Nothing#! lowers it. This is a clock, not a contest - no treaty, no gift and no concession slows it down.\n\nThe four crises fire once each, at 25, 50, 75 and 100. The last of them is the Ems Dispatch, and it arrives roughly eight years and four months after this situation opens."
 PD_bi_first_tension_threshold: "25%"
 PD_bi_second_tension_threshold: "50%"
 PD_bi_third_tension_threshold: "75%"
 PD_bi_fourth_tension_threshold: "100%"
 PD_bi_tension_25_tt: "#T At 25 Tension#!\n$BULLET$#Y The Luxembourg Crisis#! reaches every court with a presence in [ShowContinentName('europe')].\n$BULLET$A sale of territory that neither Berlin nor Paris can let pass without losing face. The first time the quarrel is spoken aloud."
 PD_bi_tension_50_tt: "#T At 50 Tension#!\n$BULLET$#Y The Continental Arms Race#! reaches every court with a presence in [ShowContinentName('europe')].\n$BULLET$Both capitals stop arguing about borders and start counting the other side's battalions."
 PD_bi_tension_75_tt: "#T At 75 Tension#!\n$BULLET$#Y The Diplomatic Breakdown#! reaches every court with a presence in [ShowContinentName('europe')].\n$BULLET$The last channels close. Nothing is left to negotiate before the final provocation."
 PD_bi_tension_100_tt: "#T At 100 Tension#!\n$BULLET$#Y The Ems Dispatch#! goes to Berlin.\n$BULLET$Every state whose capital lies in [ShowRegionName('south_german_region')] allies with the German power in the same instant - Austria, [GetCountry('FRA').GetName] and the Emperor excepted, and no one already a subject.\n$BULLET$[GetCountry('FRA').GetName] then reads it. The AI declares war at once; a French player may refuse the insult and take a five-year [ShowCasusBelliName('cb_PD_blood_and_iron')] instead."

 PD_bi_road_header: "The Road to War"
 PD_bi_road_hint: "The tension only climbs. Hover a rung to see what it brings."
 PD_bi_road_25: "The Luxembourg Crisis"
 PD_bi_road_50: "The Continental Arms Race"
 PD_bi_road_75: "The Diplomatic Breakdown"
 PD_bi_road_100: "The Ems Dispatch"
 PD_bi_sec_rematch: "If the Question Stays Open"
 PD_bi_road_250: "The Second Reckoning"
 PD_bi_road_400: "The Third Reckoning"
 PD_bi_rematch_tt: "#T The rematches#!\nIf Ems came and went with no German Empire proclaimed and the German cause not yet broken, the quarrel is handed to [GetCountry('FRA').GetName] again: once at #Y 250#! tension, about twelve and a half years after Ems, and once more at #Y 400#!, about twenty-five years after it.\n\nBoth require every party to be at peace on the month they fire, so an unfinished war postpones the reckoning rather than cancelling it."

 PD_bi_levers_header: "What We Can Do"
 PD_bi_levers_body: "#T As the German power#!\n$BULLET$There is nothing to spend and nothing to build here. The tension climbs by itself, and the whole of this phase is the wait.\n$BULLET$Use the wait. Ems hands you every south German state as an ally in one stroke, but it does not hand you an army.\n$BULLET$When the dispatch arrives those alliances are already signed - they are in the news itself, not in your answer. Your reply is what sends the provocation to Paris.\n$BULLET$Win the war that follows and [ShowPeaceTreatyTypeName('PD_blood_and_iron_proclaim_germany')] proclaims the Empire and takes the three borderlands painted red on this situation's map - [ShowAreaName('alsace_area')], [ShowAreaName('lorraine_area')] and [ShowAreaName('franche_comte_area')] - with it.\n\n#T As [GetCountry('FRA').GetName]#!\n$BULLET$A ten-year mutual truce is signed the day this situation opens. It protects the opening; it does not stop the dispatch.\n$BULLET$When Ems reaches you the AI declares war on the spot. You do not have to. Refusing the insult costs #R 10#! prestige, dissolves the truce and gives you a five-year [ShowCasusBelliName('cb_PD_blood_and_iron')] - the same war, opened when your armies are where you want them.\n$BULLET$It is not a free delay: the Prussian general staff keeps its bonus for #R 15#! years instead of 10 when you wait.\n$BULLET$Win and [ShowPeaceTreatyTypeName('PD_france_shatter_prussian_menace')] ends this situation outright, breaks the German cause and rewards the coalition.\n\n#T As anyone else in [ShowContinentName('europe')]#!\n$BULLET$All four crises come to you as news. None of them binds you.\n$BULLET$Your alliances decide this war before it is declared. The two lists at the foot of this panel are the game's own count of who would actually march, and they change as you sign.\n$BULLET$If your capital lies in [ShowRegionName('south_german_region')] you will be pulled into the German alliance the moment Ems fires - unless you are already someone's subject by then.\n\n#T How the AI plays this#!\n$BULLET$It barely decides anything here. The tension, the four crises and the southern alliances are all automatic - they happen to the AI rather than because of it.\n$BULLET$The one real decision is France's answer to the dispatch, and the AI always gives the same one: it declares war on the spot. The option to wait is written for players only, so an AI France never takes it.\n$BULLET$The Prussian general staff bonus is handed out by the event itself, not earned by anything the AI does, and only when the Prussian buff game rule is switched on.\n$BULLET$The rematches wait for peace. If any of the three is still at war on the month a reckoning falls due, it is postponed rather than cancelled."

