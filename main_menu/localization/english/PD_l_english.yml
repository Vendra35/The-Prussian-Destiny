 # -------------------------- SITUATION 2: THE PRUSSIAN ASCENSION -------------------
 # ==============================================================================

##################---- EVENTS ----##################

# --- ASCENSION EVENT (SITUATON 2 BA?LATAN EVENT) ---
 pd_brandenburg.299.title: "The Prussian Ascension"
 pd_brandenburg.299.desc: "For decades, the Hohenzollerns have consolidated their power along the Baltic coast and the heart of Brandenburg. Yet, the old order of the Holy Roman Empire, with its archaic laws and Imperial dominance from Vienna, suffocates our true potential.\n\nA new era dawns. With our borders secure, our administration stable, and our armies disciplined, it is time to look south and west. We shall bind the minor northern princes to our treasury through a grand 'Zollverein' (Customs Union), and we shall pry the rich lands of Silesia from the Emperor's grasp. The age of subservience is over; the era of Iron and Blood has begun!"
 pd_brandenburg.299.a: "Gott mit uns! (God with us!)"

 # --- EVENT 200 (PHASE 2 BA?LANGICI VE ?TT?FAK KIRMA) ---
 pd_brandenburg.200.title: "The Silesian Question"
 pd_brandenburg.200.desc: "The Hohenzollern eagle now looks south and west. Our destiny in the Baltic is secure, but true dominance requires the industrial wealth of [ShowAreaName('silesia_area')] and the strategic depth of Saxony.\n\nThe Margrave has ordered our diplomats to sever any ties of friendship with nations in these regions. The time for peaceful coexistence in Northern Germany is over. A new era of 'Blood and Iron' begins."
 pd_brandenburg.200.a: "Lauf, denn ich komme!"

 # --- EVENT 201 (?ZLEY?C?LERE 2. SITUATION BA?LADI HABER?) ---
 pd_brandenburg.201.title: "The Sleeping Giant Awakens"
 pd_brandenburg.201.desc: "For decades, the Black Eagle of the North was unnervingly quiet. After securing their Baltic holdings, the rulers of Berlin turned inward, focusing entirely on fortifying their cities and building a massive economy. Europe thought them pacified. We mistook their silence for peace.\nWe were fools. The sleeping giant has awakened.\nTerrifying reports are now pouring in from [ShowAreaName('silesia_area')] and [ShowAreaName('upper_saxony_area')]. Berlin has recalled its diplomats and severed all ties. Their endless columns of highly disciplined soldiers are massing once again. It is now brutally clear: they do not just want a kingdom. They aim to dismantle the old order of Germany entirely."
 pd_brandenburg.201.a: "Their ambition knows no bounds..."

 # --- EVENT 202 (?LK KURBANLARA HABER) ---
 pd_brandenburg.202.title: "The Shadow of Prussia"
 pd_brandenburg.202.desc: "Prussian envoys have unceremoniously cut ties with our court, and their disciplined regiments are gathering on our borders. The rumors are true: Berlin intends to subjugate our lands to fuel their rising empire. We must find powerful allies, and quickly, or face annihilation."
 pd_brandenburg.202.a: "May God protect us."

 # --- EVENT 203 (SAVA? ?LANI) ---
 pd_brandenburg.203.title: "Blood and Iron"
 pd_brandenburg.203.desc: "The waiting is over. The orders have been issued to the general staff. Our disciplined ranks will now march into the target territories, bringing them under the enlightened, if forceful, administration of the Prussian crown. Let the cannons speak!"
 pd_brandenburg.203.a: "Forward, march!"
 pd_brandenburg.203.b: "Our armies need more time before we march... (Postpone for 5 years)"

 # --- EVENT 204 (?ZLEY?C?LER ???N HRE'N?N ??K??? VE NGC'N?N DO?U?U HABER?) ---
 pd_brandenburg.204.title: "The Birth of the North German Confederation"
 pd_brandenburg.204.desc: "The unthinkable has occurred! Following a devastating and decisive victory over the Emperor's forces, Prussia has shattered the ancient Holy Roman Empire once and for all.\n\nAt the peace tables, Berlin dictated absolute terms, formally annexing the northern states and uniting them under a single, terrifying new banner: The North German Confederation. The thousand-year era of fractured German princes is over. A new, unified titan has awakened in the heart of Europe, and the balance of power will never be the same."
 pd_brandenburg.204.a: "The map of Europe has been permanently redrawn."

 # --- EVENT 205 (OYUNCU ???N S?TUAT?ON ZAFER?) ---
 pd_brandenburg.205.title: "Master of the North"
 pd_brandenburg.205.desc: "Victory! The rich lands we claimed now fuel the iron ranks of Prussia. We have bridged the gap to the west and established ourselves as the undisputed master of Northern Germany. The path to a united Federation is clearer than ever."
 pd_brandenburg.205.a: "Gott mit uns!"

 # --- EVENT 206 (?ZLEY?C?LER ???N PRUSYA S?TUAT?ON YEN?LG?S?) ---
 pd_brandenburg.206.title: "The Eagle Repelled"
 pd_brandenburg.206.desc: "In a surprising turn of events, the Prussian advance has been halted. Their ambitious campaigns into the south and west ended in humiliating defeat. The German princes breathe a sigh of relief as the Hohenzollern menace is contained... for now."
 pd_brandenburg.206.a: "A victory for the old order."

 # --- EVENT 207 (OYUNCU ???N S?TUAT?ON YEN?LG?S?) ---
 pd_brandenburg.207.title: "Halted in our Tracks"
 pd_brandenburg.207.desc: "Disaster! Our forces have been repelled from our rightful claims. The expansion has failed, leaving our treasury drained and our pride wounded. The dream of a united North is delayed, and our rivals mock our supposed 'discipline'."
 pd_brandenburg.207.a: "A temporary and bitter setback."

 # --- EVENT 208 (S?LEZYA B?T?P SIRA SAKSONYA'YA GELD???NDE ?ZLEY?C?LERE) ---
 pd_brandenburg.208.title: "The Fall of Silesia"
 pd_brandenburg.208.desc: "Prussia has successfully integrated the rich lands of Silesia. Yet, their armies do not rest. The Hohenzollern gaze now falls upon the minor states of Saxony and the West. Will Berlin use diplomacy, or the sword? When will this relentless expansion end?"
 pd_brandenburg.208.a: "They are forging a new empire."

 # --- EVENT 209 (ZOLLVEREIN KURBANLARINA "SIRA S?ZE GELD?" HABER?) ---
 pd_brandenburg.209.title: "The Zollverein's Shadow"
 pd_brandenburg.209.desc: "With Silesia under Prussian control, Berlin's diplomats and soldiers now loom over our borders. They speak of a 'Customs Union' and 'Economic protection', but we know the truth: it is subjugation in all but name. We must prepare for an ultimatum."
 pd_brandenburg.209.a: "We must tread carefully."

 # --- EVENT 210 (ZOLLVEREIN ?LT?MATOMU - K???K ?LKELERE G?DEN EVENT) ---
 pd_brandenburg.210.title: "The Zollverein Proposal"
 pd_brandenburg.210.desc: "An envoy from [GetCountry('PRU').GetName] has arrived at our court. They present a thinly veiled 'offer' to join the Zollverein, a customs union led by Berlin. \n\nIn exchange for economic integration and their 'protection', we must effectively surrender our foreign policy and become a vassal of the Prussian crown. To refuse is to invite the wrath of the most disciplined army in Europe."
 pd_brandenburg.210.a: "There is no need for bloodshed. We recognize Prussian supremacy."
 pd_brandenburg.210.b: "The North will never kneel to Berlin! (WAR)"

# --- EVENT 211 (ZOLLVEREIN KABUL ED?LD? - PRUSYA'YA B?LD?R?M) ---
 pd_brandenburg.211.title: "A Northern State Joins the Zollverein!"
 pd_brandenburg.211.desc: "Excellent news from the diplomatic corps! Recognizing the inevitable supremacy of our armies and the economic benefits of our union, the targeted state has bowed to our pressure.\n\nThey have signed the treaties and are now a loyal subject of the Prussian state. The North grows stronger without a single shot fired."
 pd_brandenburg.211.a: "Diplomacy is merely war by other means."
 pd_brandenburg.211.b: "Our armies are ready. We need no more vassals."

 # --- EVENT 212 (ZOLLVEREIN REDDED?LD? - PRUSYA'YA B?LD?R?M) ---
 pd_brandenburg.212.title: "The Zollverein is Rejected!"
 pd_brandenburg.212.desc: "The fools have rejected our generous offer of integration into the Zollverein. They cling to their petty independence, perhaps hoping that the Emperor or some foreign power will save them. \n\nThey leave us no choice. The diplomatic phase is over."
 pd_brandenburg.212.a: "Then they shall have blood and iron!"

 # --- EVENT 213: ?MPARATORUN KAYGISI (Avusturya'ya Giden Event) ---
 pd_brandenburg.213.title: "The Northern Menace"
 pd_brandenburg.213.desc: "Grave news from the Imperial Diet. [GetCountry('PRU').GetName] has not only secured the Baltic coast but is now aggressively expanding its economic and military influence southward.\n\nThey call it a 'Zollverein', a customs union, but our advisors know the truth. It is a calculated move to strip the Holy Roman Empire of its northern princes, binding them to Berlin with chains of silver and iron. The Imperial authority in the north is eroding by the day."
 pd_brandenburg.213.a: "This insolence cannot be tolerated forever."

 # --- EVENT 214: ?MPARATORUN ?LT?MATOMU (Avusturya/HRE Liderine Gider) ---
 pd_brandenburg.214.title: "The Northern Insolence"
 pd_brandenburg.214.desc: "The audacity of [GetCountry('PRU').GetName] has crossed the final line. They have subjugated the northern princes, swallowed Silesia, and formed their illicit 'Zollverein'. They now stand as a direct challenge to the Imperial authority of the Holy Roman Empire.\n\nWe must send a final, unyielding ultimatum to Berlin: Disband your union, retreat from your occupied territories, and bow to the Emperor, or face the full, devastating might of the Imperial armies."
 pd_brandenburg.214.a: "Send the ultimatum. They must withdraw!"
 pd_brandenburg.214.b: "They are too powerful. We must accept this new reality."

 # --- EVENT 215: PRUSYA ?LT?MATOMU ALIYOR (Kan ve Demir Karar?) ---
 pd_brandenburg.215.title: "The Emperor's Ultimatum"
 pd_brandenburg.215.desc: "An Imperial envoy from Vienna has arrived in our court, carrying terms of absolute surrender. The Emperor demands that we dismantle our administration in the newly acquired territories, dissolve the Zollverein, and kneel before the archaic institutions of the Holy Roman Empire.\n\nTo submit is to erase decades of our glorious progress and humiliate our state forever. To refuse is to plunge the German states into a devastating Brothers' War. The world watches us."
 pd_brandenburg.215.a: "The great questions of the day will be settled by Iron and Blood!"
 pd_brandenburg.215.b: "We cannot face Vienna. We must yield..."

 # --- EVENT 216: AVRUPA'YA SAVA? ?NCES? GER?L?M HABER? ---
 pd_brandenburg.216.title: "The Gathering Storm"
 pd_brandenburg.216.desc: "The situation within the Empire has reached a boiling point. Having first wrested the wealthy lands of Silesia from Imperial influence, and subsequently subjugated the princes of Saxony and the northern coasts, [GetCountry('PRU').GetName] now stands unchallenged in the North.\n\nWith their regional consolidation complete, the court in Berlin has turned its full attention toward the Emperor. This is no longer a matter of mere border disputes; it is a direct challenge to the ancient Imperial order.\nTensions are at an all-time high. The old order of the Holy Roman Empire is about to face its greatest existential threat. War seems inevitable."
 pd_brandenburg.216.a: "A clash of titans approaches."

 # --- EVENT 217: T?M AVRUPAYA B?Y?K SAVA? BA?LADI HABER? ---
 pd_brandenburg.217.title: "The Brothers' War"
 pd_brandenburg.217.desc: "The unthinkable has happened! Diplomatic channels have completely broken down, and the forces of [GetCountry('PRU').GetName] have officially declared war upon the Emperor. What began as a regional consolidation in the North has now erupted into a full-scale struggle for dominance over the German states.\n\nThe disciplined ranks of the Prussian army are marching south to dismantle the ancient Holy Roman Empire once and for all. Europe watches in awe and terror as the era of Iron and Blood reaches its climax."
 pd_brandenburg.217.a: "The fate of the Empire hangs in the balance."

  # --- PHASE 2 HRE EMPEROR VICTORY ---
 pd_brandenburg.220.title: "The Upstart Crushed"
 pd_brandenburg.220.desc: "Against all odds, the Imperial armies have prevailed! The so-called invincible Prussian State lies broken before the Emperor's forces. Their illegal 'Zollverein' is humiliated, and their northern hegemony has collapsed.\n\nThe Emperor has restored order to the Holy Roman Empire. Imperial authority sits unchallenged, and the Prussian ambition has been permanently shattered."
 pd_brandenburg.220.a: "Gott erhalte den Kaiser!"
 PD_emperor_victory_event_tt: "We have gained the [ShowModifier('PD_emperor_restoration_of_order')] modifier for 50 years. [GetCountry('PRU').GetName] has lost their ascension and military supremacy modifiers, and gained the crippling [ShowModifier('PD_shattered_german_ambition')] modifier for 50 years.\n\n#G THE FALL OF THE ZOLLVEREIN:#! All of [GetCountry('PRU').GetName]'s dependent Northern German subjects have immediately declared their independence."

 pd_brandenburg.221.title: "The Ambition Shattered"
 pd_brandenburg.221.desc: "Disaster! Our attempt to seize hegemony from the Emperor has failed catastrophically. The Imperial armies have crushed our forces on the battlefield.\n\nWe have been forced to accept a humiliating peace. Our geopolitical dominance in the North is heavily contested, and the dream of a united Germany under the Prussian crown has been delayed."
 pd_brandenburg.221.a: "A dark day for Prussia..."
 PD_prussia_defeat_event_tt: "Our glorious ascension campaign has been violently halted. We have lost all our temporary ascension modifiers and have gained the crippling [ShowModifier('PD_shattered_german_ambition')] modifier for 50 years. The Emperor has gained the [ShowModifier('PD_emperor_restoration_of_order')] modifier.\n\n#R THE FALL OF THE ZOLLVEREIN:#! Our entire web of diplomacy has collapsed. All of our dependent Northern German subjects have immediately severed their ties with us and declared independence!"

 PD_emperor_crush_prussian_hegemony_entry: "Restore Imperial Order"
 PD_emperor_crush_prussian_hegemony_entry_short: "Restore Imperial Order"
 PD_emperor_crush_prussian_hegemony_desc: "Break the military core of the Prussian state and permanently shatter their ambitions in the North, securing the Emperor's absolute authority over the German states."
 PD_emperor_crush_prussian_hegemony_tt: "The Prussian threat will be forcefully aborted. They will suffer immense unrest, lose their historical situation modifiers, and gain the crippling [ShowModifier('PD_shattered_german_ambition')] modifier for 50 years. We will gain the glorious [ShowModifier('PD_emperor_restoration_of_order')] modifier.\n\n#G THE FALL OF THE ZOLLVEREIN:#! All of their Northern German subjects will immediately be granted independence."

 # --- SITUATION (DURUM) VE HEDEFLER (PHASE 2) ---
 the_prussian_ascension: "The Prussian Ascension"
 the_prussian_ascension_desc: "With our eastern borders secured, [GetCountry('PRU').GetName] must now challenge the old Imperial order and establish total hegemony over [ShowRegionName('north_german_region')].\n\nFirst, the wealthy [ShowAreaName('silesia_area')] must be ripped from its current masters. Then we shall march west into the Saxon and Westphalian lands, binding the northern states to us through the Zollverein or crushing those who refuse it."



