 PD_PA_STEP_LABEL: "The Ascension"
 PD_pa_step_meter_tt: "Where [GetCountry('PRU').GetName] stands on the road to a Germany run from Berlin.\n\nThe situation keeps one number, and nothing else moves it: the step advances only when the lands of the current step are wholly held by [GetCountry('PRU').GetName] or by its subjects.\n\n$BULLET$#Y 1#! - [ShowAreaName('silesia_area')]\n$BULLET$#Y 2#! - the western march\n$BULLET$#Y 3#! - the great ultimatum"
 PD_pa_step_1: "Silesia"
 PD_pa_step_2: "The Western March"
 PD_pa_step_3: "The Great Ultimatum"
 PD_pa_step_1_diverted: "Silesia - blocked"

 PD_pa_road_header: "The Road to Berlin's Germany"
 PD_pa_road_hint: "A step closes only when its lands are wholly Prussian. Hover a rung to see what that means."
 PD_pa_stall_note: "[ShowAreaName('silesia_area')] has held out for [Divide_CFixedPoint(SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('PD_phase2_step_stall').GetValue, '(CFixedPoint)12')|Y0] years, and the step cannot close until it falls.\n\nBerlin will not open a war while the enemy's whole alliance network outweighs its own. If the road stays shut it starts accepting worse odds - up to half again its own strength - so long as it still out-guns the enemy's own army. And if it is still shut long after that, it turns west first to grow into the strength the province will take."
 PD_pa_diverted_note: "[ShowAreaName('silesia_area')] has been beyond reach for [Divide_CFixedPoint(SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('PD_phase2_step_stall').GetValue, '(CFixedPoint)12')|Y0] years, so Berlin has turned west to build the strength the province will take. The step still closes on [ShowAreaName('silesia_area')] and nothing else - this is the road to it, not a way around it, and the month the province can be taken Berlin turns back for it."
 PD_pa_step_1_tt: "#T Step 1 - [ShowAreaName('silesia_area')]#!\nThe step closes when #Y every#! location in [ShowAreaName('silesia_area')] is owned by [GetCountry('PRU').GetName] or by one of its subjects. A single holdout keeps the whole situation on step 1.\n\nWhen it closes, onlookers hear of the fall of Silesia and the owners of the western lands are told who is next.\n\n#T When Silesia will not fall#!\nBerlin normally moves only against a country whose whole defensive network is weaker than its own offensive one - a test that a [ShowAreaName('silesia_area')] held by a great power fails for a very long time. Two things open after that:\n$BULLET$After #Y 10#! years on this step Prussia raises the odds it will accept: the enemy's alliance may outweigh ours by half again, so long as Prussia still out-guns the enemy's own army. The allies are not ignored - they stop being disqualifying. That was Frederick's calculation in December 1740.\n$BULLET$After #Y 20#!, the western lands open as targets so that Prussia can grow into the strength Silesia will take. The step itself does not move: it still closes on [ShowAreaName('silesia_area')] and nothing else."
 PD_pa_step_2_tt: "#T Step 2 - the western march#!\nThe same test, over a wider board: [ShowAreaName('lower_saxony_area')], [ShowAreaName('upper_saxony_area')], [ShowAreaName('mecklenburg_area')], [ShowAreaName('holstein_area')], [ShowAreaName('westphalia_area')], [ShowAreaName('hesse_area')] and [ShowAreaName('rhineland_area')] must all be Prussian or Prussian-subject.\n\nThis is where the Zollverein does its work: a state that accepts the customs union is bound without a war."
 PD_pa_step_3_tt: "#T Step 3 - the great ultimatum#!\nThe north is held, and the quarrel is no longer with small states but with the Emperor. The ultimatum goes out, and the answer to it is the hegemony war.\n\nThis is the step where the situation can be lost as well as won: a victorious Emperor can enforce [ShowPeaceTreatyTypeName('PD_emperor_crush_prussian_hegemony')] and end the ascension outright."

