 # ==============================================================================
 # BLOOD AND IRON - HISTORICAL CONTEXT CARD
 # Lifted out of the_blood_and_iron_desc: the engine shows a situation's
 # description in places with far less room, and every vanilla situation keeps
 # that text purely in-world.
 # ==============================================================================

 PD_bi_history_header: "Historical Context"
 PD_bi_history_body: "#T The Confederation and the missing south#!\nPrussia broke Austria at Königgrätz in 1866, dissolved the old German Confederation and bound the north to Berlin. The southern kingdoms - Bavaria, Württemberg, Baden and Hesse-Darmstadt - stayed outside it. They had signed defensive treaties with Prussia, but no southern parliament was going to vote itself into a Hohenzollern empire while France stood guarantor of their independence.\n\n#T The dispatch#!\nIn July 1870 a Hohenzollern prince was offered the vacant Spanish throne. Paris objected, and the French ambassador pressed Wilhelm I at the spa town of Bad Ems for a promise that the candidacy would never be revived. The king refused politely and wired Berlin an account of the meeting. Bismarck shortened that account before releasing it to the press on 13 July - inventing nothing, cutting away every courtesy, so that each nation read an insult to itself. France declared war six days later.\n\n#T Iron and blood#!\nThe southern states honoured their treaties within days, and the war France believed it had declared on Prussia was fought against Germany. Napoleon III was captured at Sedan on 2 September 1870. On 18 January 1871, in the Hall of Mirrors at Versailles, the German Empire was proclaimed - an empire founded in a French palace, by a war fought to make it necessary. The Treaty of Frankfurt took Alsace and most of Lorraine that May, and left France a grievance it carried until 1918."

