 # 2.SITUATION --- Phase 2: Prussian Ascension
 cb_PD_prussian_ascension: "Prussian Ascension"
 cb_PD_prussian_ascension_desc: "Prussian influence must expand to its natural limits. By securing the rich fields of Silesia and the vital trade hubs of the North, we shall prove that Prussia is no longer a mere duchy, but a rising titan.\n\nConquest with this [casus_belli|e] will be limited to the [ShowAreaName('silesia_area')], [ShowAreaName('upper_saxony_area')], [ShowAreaName('lower_saxony_area')], [ShowAreaName('mecklenburg_area')], [ShowAreaName('westphalia_area')] and [ShowAreaName('holstein_area')] [areas|e]."
 
