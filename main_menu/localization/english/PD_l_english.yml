 NGC_ADJ: "North German"
 NGC_f: "North German Confederation"
 NGC_f_desc: "A union of northern German states forged through shared culture, language, and ambition. United under strong leadership, it stands as the first major step toward a fully unified German nation."
 ngc_confederation: ""

 # -------------------------- SITUATION 3: BLOOD AND IRON -------------------
 the_blood_and_iron: "Blood and Iron"
 the_blood_and_iron_desc: "The North German states are united under Berlin's banner, but the great question of Germany remains unanswered. Over the Rhine, the French Empire watches our rise with fear and jealousy. Chancellor Bismarck knows that to knit the final pieces of Germany together, a common enemy is needed.\n\nThe destiny of Germany will not be settled by speeches and majority decisions, but by iron and blood. We must navigate the rising diplomatic tension, isolate France, and force them into a war that will rally the reluctant Southern German states to our side.\n\n#Y ----------------------------------------#!\n\n#G HISTORICAL CONTEXT & AI BEHAVIOR:#!\nIn 1870, Otto von Bismarck successfully provoked France into declaring war on Prussia by editing the 'Ems Dispatch' to insult both nations. The aggressive French response frightened the independent Southern German states, causing them to immediately ally with Prussia.\n\n#Y What to Expect:#! As tensions passively rise each month, diplomatic flavor events will fire. Upon reaching maximum tension, the 'Ems Dispatch' will trigger. The Southern German states will automatically form an alliance with the North German Confederation, and France will declare war shortly after. Winning this final defensive war will allow the formation of the German Empire and the automatic annexation of the red-highlighted imperial borderlands ([ShowAreaName('alsace_area')], [ShowAreaName('lorraine_area')] and [ShowAreaName('franche_comte_area')]).\n#R However, the French coalition can intervene! If a player is France or their ally, they can enforce the 'Shatter the German Menace' peace treaty. This will instantly end the Situation, inflict severe debuffs on the German forces, and secure powerful buffs for the victors.#!"

 # --- PHASE 3 EVENTLERI ---
 pd_brandenburg.300.title: "The Path to Empire"
 pd_brandenburg.300.desc: "With the North secured, only one obstacle remains to full German unification: the reluctance of the Southern states and the paranoia of France. We must carefully navigate the diplomatic tensions, isolate the French, and when the moment is right, provoke them into a war they cannot win. Only then will the South rally to our cause."
 pd_brandenburg.300.a: "The final piece of the puzzle."

 pd_brandenburg.301.title: "The Prussian Threat"
 pd_brandenburg.301.desc: "The sudden and aggressive rise of the North German Confederation has completely upended the balance of power in Europe. Paris watches in horror as their neighbor across the Rhine grows stronger by the day. French diplomats demand security guarantees, but Berlin's replies are increasingly uncooperative."
 pd_brandenburg.301.a: "We must not let them unite."

 pd_brandenburg.302.title: "The Ems Dispatch"
 pd_brandenburg.302.desc: "A minor succession dispute in Spain has given Bismarck the perfect opportunity. When the French ambassador aggressively demanded that the Hohenzollern family renounce their claims forever, King Wilhelm politely declined and sent a telegram to Berlin. Our Chancellor has meticulously edited this telegram to make it sound like a grave insult to both sides. The press is already printing it!"
 pd_brandenburg.302.a: "Release it to the press. Let the French seethe!"

 pd_brandenburg.303.title: "The Southern Princes Rally"
 pd_brandenburg.303.desc: "The edited Ems Dispatch has outraged the French public to the point of war, but it has had a profound effect on the German people as well. Seeing France aggressively bullying a German monarch has sparked a wave of pan-German nationalism. The southern princes have forgotten their old rivalries and pledged their armies to our command."
 pd_brandenburg.303.a: "Deutschland ?ber alles!"

 pd_brandenburg.304.title: "The Ems Insult"
 pd_brandenburg.304.desc: "The Prussians have intentionally humiliated our ambassador in the press! The streets of Paris are filled with angry mobs demanding vengeance against this upstart proto-German confederation. The Emperor's honor is at stake. There is only one response to such an insult."
 pd_brandenburg.304.a: "A Berlin! (Declare War)"
 pd_brandenburg.304.b: "Let our armies gather. We shall attack on our own terms."

 pd_brandenburg.305.title: "The Franco-Prussian War"
 pd_brandenburg.305.desc: "War has broken out! France, insulted by the Ems Dispatch, has foolishly declared war on the North German Confederation. Instead of isolating Berlin, they have driven all the southern German states straight into Bismarck's open arms. This is no longer just a war; it is the birth pangs of an Empire."
 pd_brandenburg.305.a: "The world watches."

 pd_brandenburg.306.title: "The Proclamation of the German Empire"
 pd_brandenburg.306.desc: "Victory! The French armies have been crushed, their Emperor captured, and Paris itself besieged. In the ultimate humiliation, our Chancellor has gathered the princes of Germany in the Hall of Mirrors at the Palace of Versailles. There, surrounded by the glory of our fallen enemy, King Wilhelm is proclaimed German Emperor.\n\nThe regional kings and dukes have sworn fealty. The South is integrated. Alsace-Lorraine is ours. A new superpower, forged in blood and iron, now dominates the continent."
 pd_brandenburg.306.a: "Heil dir im Siegerkranz!"

 # --- WARGOALS VE CASUS BELLI ---
 cb_PD_blood_and_iron: "Blood and Iron"
 cb_PD_blood_and_iron_desc: "A war to settle the German Question once and for all."
 war_goal_PD_war_goal_blood_and_iron: "Defend against French Aggression"
 war_goal_PD_war_goal_blood_and_iron_desc: "We must defend our fatherland, and in doing so, take the natural border of Alsace-Lorraine for the security of a united Germany."
 PD_blood_and_iron_proclaim_germany_entry: "Proclaim the German Empire"
 PD_blood_and_iron_proclaim_germany_entry_short: "Proclaim the German Empire"
 PD_blood_and_iron_proclaim_germany_desc: "Force France to cede the historically German lands of Alsace-Lorraine and proclaim the united German Empire in the halls of Versailles."
 PD_blood_and_iron_proclaim_germany_tt: "France will cede [ShowAreaName('alsace_area')], [ShowAreaName('lorraine_area')] and [ShowAreaName('franche_comte_area')] areas. This monumental victory will trigger the formation of the German Empire! and the integration of all allied Southern German states."

 # --- PHASE 3 FRENCH VICTORY ---
 pd_brandenburg.307.title: "The Prussian Menace Shattered"
 pd_brandenburg.307.desc: "Against all expectations, our glorious armies have repelled the northern aggression! The so-called invincible war machine of the North German Confederation lies broken on our battlefields.\n\nNot only have we defended our homeland, but we have humiliated Berlin on the world stage. Their dreams of uniting the German states under iron and blood have been permanently shattered. France remains the undisputed hegemon of Europe!"
 pd_brandenburg.307.a: "Vive la France!"

 pd_brandenburg.308.title: "Shattered Ambitions"
 pd_brandenburg.308.desc: "Disaster! Our forces have been routed. The French defensive lines proved too much for our armies, and our great offensive has collapsed in humiliating defeat.\n\nOur prestige is ruined, the southern German states have lost all faith in our leadership, and internal unrest spreads through our cities. The dream of a united German Empire is dead, drowned not in glory, but in shame."
 pd_brandenburg.308.a: "A dark day for the Fatherland."

 PD_france_shatter_prussian_menace_entry: "Shatter the German Menace"
 PD_france_shatter_prussian_menace_entry_short: "Shatter the German Menace"
 PD_france_shatter_prussian_menace_desc: "Break the military illusion of the North German Confederation, crippling their unification ambitions and securing French dominance in Europe."
 PD_france_shatter_prussian_menace_tt: "The North German unification will be forcefully aborted. [GetCountry('NGC').GetName] will suffer immense unrest, and gain the crippling [ShowModifier('PD_shattered_german_ambition')] modifier for 50 years. We will gain the glorious [ShowModifier('PD_defender_of_the_rhine')] modifier."

 # --- TENSION FLAVOR EVENTS(25-50-75) ---
 pd_brandenburg.309.title: "The Luxembourg Crisis"
 pd_brandenburg.309.desc: "Tensions between Paris and Berlin are escalating. A major diplomatic incident has just sparked over the status of Luxembourg. France sought to purchase the territory to offset Prussian gains, but Chancellor Bismarck publicly leaked the deal, causing an uproar in the German states. While war has been averted for now, the trust between the two empires is irreparably damaged."
 pd_brandenburg.309.a: "The rift deepens..."

 pd_brandenburg.310.title: "The Continental Arms Race"
 pd_brandenburg.310.desc: "Reports from both sides of the Rhine speak of massive military preparations. [GetCountry('FRA').GetName] is rapidly reforming its army, equipping troops with the deadly new Chassepot rifle. In response, the [GetCountry('NGC').GetName] is expanding its railway networks and mobilizing its General Staff to ensure lightning-fast troop movements. The continent holds its breath."
 pd_brandenburg.310.a: "Preparing for the inevitable."

 pd_brandenburg.311.title: "The Diplomatic Breakdown"
 pd_brandenburg.311.desc: "The delicate peace in Europe is fraying. Ambassadors in both Paris and Berlin are trading insults rather than treaties. The French press demands action against the rising 'German Menace', while pan-German nationalists clamor for a unified front against French meddling. It feels like only a single spark is needed to ignite the powder keg."
 pd_brandenburg.311.a: "One spark is all it takes."

 blood_and_iron_ngc_destroyed_tt: "The [GetCountry('NGC').GetName] no longer exists."
 blood_and_iron_fra_destroyed_tt: "[GetCountry('FRA').GetName] no longer exists."
 blood_and_iron_victory_tt: "[GetCountry('NGC').GetName] have defeated [GetCountry('FRA').GetName] and are ready to proclaim the #YGerman Empire#!."
 blood_and_iron_defeat_tt: "[GetCountry('FRA').GetName] has successfully halted [GetCountry('NGC').GetName] unification plans."
 blood_and_iron_stalemate_tt: "Stalemate: If no decisive peace treaty is signed after 3 major war attempts (at 100, 250, and 400 months), the Situation is going to be closed permanently at 450 months (37.5 years)."
 PD_blood_and_iron_map_tt: "#R Targeted Imperial Territory#!\nIf [GetCountry('NGC').GetName] wins the war against [GetCountry('FRA').GetName], they will automatically annex this region."

#---------- Bureaucratic Localization (For Flavor) ----------

 # 1. Bundesschatzamt (Ekonomi - Federal Hazine)
 pd_ngc_bundesschatzamt_bureaucracy: "Bundesschatzamt"
 pd_ngc_bundesschatzamt_bureaucracy_desc: "The central financial administration of the Confederation. It harmonizes the disparate treasuries of the North German states into a single, disciplined fiscal engine, ensuring that every thaler is accounted for in the service of the federal budget."

 # 2. Norddeutsche Gewerbeordnung (Ekonomi - Sanayi ve Ticaret Kanunu)
 pd_ngc_gewerbeordnung_bureaucracy: "Norddeutsche Gewerbeordnung"
 pd_ngc_gewerbeordnung_bureaucracy_desc: "A unified legal framework that shatters the old guild monopolies and standardizes trade across the North. This regulation paves the way for industrial dominance by ensuring that labor and capital can flow freely throughout the federal territories."

 # 3. Bundeskanzleramt (Diplomasi - Federal Şansölyelik)
 pd_ngc_bundeskanzleramt_bureaucracy: "Bundeskanzleramt"
 pd_ngc_bundeskanzleramt_bureaucracy_desc: "The executive heart of the Confederation. Overseen by the Federal Chancellor, this office streamlines diplomatic efforts and ensures that the diverse interests of member states are subordinated to a single, powerful, and rational foreign policy."

 # 4. Landwehr-Inspektion (Askeri - Rezerv Denetimi)
 pd_ngc_landwehr_inspektion_bureaucracy: "Landwehr-Inspektion"
 pd_ngc_landwehr_inspektion_bureaucracy_desc: "Modernizing the traditional citizen-soldier. This body oversees the rigorous training and inspection of reserve forces, ensuring that the transition from a local levy to a professionalized national guard is seamless and combat-ready at a moment's notice."

 # 5. Artillerie-Prüfungs-Kommission (Askeri - Teknik ve Kuşatma)
 pd_ngc_artillerie_kommission_bureaucracy: "Artillerie-Prüfungs-Kommission"
 pd_ngc_artillerie_kommission_bureaucracy_desc: "Dedicated to the supremacy of fire. This technical body oversees the development and standardization of heavy ordnance, turning the Confederation’s military into a force capable of shattering the strongest fortifications in Europe with unmatched precision."

 # 6. Königliches Militärkabinett (Askeri - Mutlak Komuta)
 pd_ngc_militaerkabinett_bureaucracy: "Königliches Militärkabinett"
 pd_ngc_militaerkabinett_bureaucracy_desc: "The sovereign's personal military staff. By insulating the officer corps from civilian oversight and administrative meddling, it ensures that the army remains a loyal and autonomous tool of the state, directed solely by the strategic will of the crown."











